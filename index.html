<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="description" content="스픽 3단계 학습법 기반 영어 스피킹 웹앱 — 핵심 패턴, 패턴 변형, 실전 롤플레이">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%233B6EF6'/%3E%3Cpath d='M30 38h40M30 52h28M30 66h34' stroke='white' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Speak Daily · 영어 스피킹</title>
<style>
/* ============================================================
   Speak Daily — 모바일 영어 스피킹 학습 앱
   ============================================================ */
:root{
  --bg:#F2F5FC; --bg-grad1:#EAF0FE; --bg-grad2:#F7F9FE;
  --card:#FFFFFF; --card-2:#F6F8FE; --card-3:#EEF3FE;
  --text:#0F172A; --text-2:#5B6986; --text-3:#8A97B0;
  --line:#E3E9F5; --line-strong:#D3DDF0;
  --primary:#3B6EF6; --primary-d:#2A55D4; --primary-soft:#E7EEFF; --primary-soft-2:#D8E4FF;
  --ok:#0FA968; --ok-soft:#E3F8EE;
  --warn:#F79009; --warn-soft:#FEF3E2;
  --bad:#EC4A3A; --bad-soft:#FDECEA;
  --shadow:0 8px 26px rgba(23,44,92,.08);
  --shadow-sm:0 2px 10px rgba(23,44,92,.06);
  --r-lg:22px; --r-md:16px; --r-sm:12px; --r-full:999px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
[data-theme="dark"]{
  --bg:#080D1A; --bg-grad1:#0E1730; --bg-grad2:#080D1A;
  --card:#121A2E; --card-2:#0E1526; --card-3:#18223A;
  --text:#EAF0FB; --text-2:#9DACC7; --text-3:#7A88A3;
  --line:#222D46; --line-strong:#2C3860;
  --primary:#5B87FF; --primary-d:#7CA0FF; --primary-soft:#182440; --primary-soft-2:#1E2C4E;
  --ok:#3BD68C; --ok-soft:#12291F;
  --warn:#FBBF4D; --warn-soft:#2A2114;
  --bad:#FF7A6B; --bad-soft:#2C1614;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --shadow-sm:0 2px 12px rgba(0,0,0,.28);
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
html{ background:var(--bg); }
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Segoe UI",system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button, input, textarea, select{ font-family:inherit; font-size:inherit; color:inherit; }
button{ border:0; background:none; cursor:pointer; padding:0; }
[hidden]{ display:none !important; }

.app{
  max-width:560px; margin:0 auto; min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column;
  background:linear-gradient(180deg,var(--bg-grad1) 0%, var(--bg-grad2) 260px, var(--bg) 520px);
  position:relative;
}
.app::before{
  content:""; position:fixed; inset:0; pointer-events:none;
  background:radial-gradient(720px 320px at 50% -140px, rgba(59,110,246,.20), transparent 70%);
  z-index:0;
}
[data-theme="dark"] .app::before{ background:radial-gradient(720px 320px at 50% -140px, rgba(91,135,255,.16), transparent 70%); }

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  padding:calc(10px + var(--safe-t)) 18px 10px;
  display:flex; align-items:center; gap:10px;
  background:linear-gradient(180deg, var(--bg-grad1) 60%, rgba(242,245,252,0));
  backdrop-filter:blur(8px);
}
[data-theme="dark"] .topbar{ background:linear-gradient(180deg, var(--bg) 60%, rgba(8,13,26,0)); }
.brand{ display:flex; align-items:center; gap:9px; flex:1; min-width:0; }
.brand-mark{
  width:34px; height:34px; border-radius:11px; flex:none;
  background:linear-gradient(145deg,#4B7BFF,#2A55D4);
  color:#fff; display:grid; place-items:center; font-weight:800; font-size:17px;
  box-shadow:0 6px 16px rgba(59,110,246,.35);
}
.brand-name{ font-weight:800; font-size:17px; letter-spacing:-.3px; }
.brand-sub{ font-size:11px; color:var(--text-3); font-weight:600; margin-top:-2px; }
.streak{
  display:flex; align-items:center; gap:5px; padding:7px 12px 7px 10px;
  border-radius:var(--r-full); background:var(--card); border:1px solid var(--line);
  box-shadow:var(--shadow-sm); font-weight:800; font-size:14px; flex:none;
}
.streak .flame{ font-size:15px; }
.streak small{ font-weight:700; color:var(--text-3); font-size:11px; }
.icon-btn{
  width:38px; height:38px; border-radius:50%; display:grid; place-items:center;
  background:var(--card); border:1px solid var(--line); color:var(--text-2);
  box-shadow:var(--shadow-sm); flex:none;
}

/* ---------- content ---------- */
.content{ flex:1; position:relative; z-index:1; padding:4px 16px calc(96px + var(--safe-b)); }
.section-title{ font-size:13px; font-weight:800; color:var(--text-3); letter-spacing:.4px; text-transform:uppercase; margin:22px 2px 10px; }
.h1{ font-size:24px; font-weight:800; letter-spacing:-.6px; margin:6px 2px 2px; }
.h1 em{ font-style:normal; color:var(--primary); }
.sub{ color:var(--text-2); font-size:14px; margin:4px 2px 0; }

/* ---------- track tabs ---------- */
.tracktabs{
  display:flex; gap:6px; padding:5px; margin:10px 0 4px;
  background:var(--card-3); border-radius:16px; position:relative;
}
.tracktabs button{
  flex:1; padding:11px 6px; border-radius:12px; font-weight:800; font-size:13.5px;
  color:var(--text-2); transition:.18s; line-height:1.2;
}
.tracktabs button .tnum{ display:block; font-size:10.5px; font-weight:700; color:var(--text-3); margin-top:2px; }
.tracktabs button[aria-selected="true"]{
  background:var(--card); color:var(--primary); box-shadow:0 3px 12px rgba(23,44,92,.10);
}
.tracktabs button[aria-selected="true"] .tnum{ color:var(--primary); opacity:.75; }

/* ---------- track header card ---------- */
.trackcard{
  margin-top:12px; padding:16px 18px; border-radius:var(--r-lg);
  background:linear-gradient(135deg, #3B6EF6, #2A55D4 65%, #2346B8);
  color:#fff; box-shadow:0 12px 28px rgba(43,86,214,.28); position:relative; overflow:hidden;
}
.trackcard::after{
  content:""; position:absolute; right:-40px; top:-50px; width:170px; height:170px;
  border-radius:50%; background:rgba(255,255,255,.10);
}
.trackcard h2{ margin:0; font-size:18px; letter-spacing:-.3px; }
.trackcard p{ margin:5px 0 0; font-size:12.5px; opacity:.86; line-height:1.45; }
.tc-bar{ margin-top:14px; height:8px; border-radius:99px; background:rgba(255,255,255,.24); overflow:hidden; }
.tc-bar > i{ display:block; height:100%; border-radius:99px; background:#fff; transition:width .45s ease; }
.tc-foot{ display:flex; justify-content:space-between; font-size:11.5px; font-weight:700; margin-top:7px; opacity:.9; }

/* ---------- chapter chips ---------- */
.chips{ display:flex; gap:8px; overflow-x:auto; padding:14px 2px 2px; margin:0 -2px; scrollbar-width:none; }
.chips::-webkit-scrollbar{ display:none; }
.chip{
  flex:none; padding:9px 14px; border-radius:var(--r-full); font-size:13px; font-weight:700;
  background:var(--card); border:1px solid var(--line); color:var(--text-2); white-space:nowrap;
  box-shadow:var(--shadow-sm); transition:.15s;
}
.chip[aria-selected="true"]{ background:var(--primary); border-color:var(--primary); color:#fff; box-shadow:0 6px 16px rgba(59,110,246,.32); }
.chip .cnt{ opacity:.65; font-weight:700; font-size:11.5px; margin-left:3px; }

/* ---------- day grid ---------- */
.daygrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
.daycard{
  position:relative; text-align:left; padding:14px 13px 13px; border-radius:var(--r-md);
  background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow-sm);
  display:flex; flex-direction:column; gap:7px; min-height:104px; transition:transform .12s, box-shadow .18s;
}
.daycard:active{ transform:scale(.975); }
.daycard .dnum{
  font-size:11px; font-weight:800; color:var(--primary); letter-spacing:.3px;
  display:flex; align-items:center; gap:5px;
}
.daycard .dtitle{ font-size:13.5px; font-weight:700; line-height:1.35; letter-spacing:-.2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.daycard .dkey{ font-size:11.5px; color:var(--text-3); line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-top:auto; }
.daycard.done{ background:linear-gradient(160deg,var(--ok-soft),var(--card) 75%); border-color:rgba(15,169,104,.30); }
.daycard.done .dnum{ color:var(--ok); }
.daycard .badge{
  position:absolute; top:11px; right:11px; width:20px; height:20px; border-radius:50%;
  background:var(--ok); color:#fff; display:none; place-items:center; font-size:12px; font-weight:900;
}
.daycard.done .badge{ display:grid; }
.daycard.review .dnum::before{ content:"↻"; font-size:12px; }

/* ---------- empty state / banners ---------- */
.empty{
  text-align:center; padding:42px 20px; border-radius:var(--r-lg);
  background:var(--card); border:1px dashed var(--line-strong); margin-top:16px;
}
.empty .emoji{ font-size:38px; }
.empty h3{ margin:12px 0 6px; font-size:16.5px; }
.empty p{ margin:0; color:var(--text-2); font-size:13.5px; line-height:1.55; }

/* ---------- bottom nav ---------- */
.tabbar{
  position:fixed; bottom:0; left:0; right:0; z-index:30;
  max-width:560px; margin:0 auto;
  padding:8px 14px calc(8px + var(--safe-b));
  display:flex; gap:4px;
  background:var(--card);
  background:color-mix(in srgb, var(--card) 88%, transparent);
  backdrop-filter:blur(14px) saturate(1.4);
  border-top:1px solid var(--line);
}
.tabbar button{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 0 4px;
  color:var(--text-3); font-size:10.5px; font-weight:800; border-radius:12px;
}
.tabbar button[ aria-current="page" ]{ color:var(--primary); }
.tabbar button[aria-current="page"] .ico{ background:var(--primary-soft); }
.tabbar .ico{ width:44px; height:26px; border-radius:99px; display:grid; place-items:center; transition:.18s; }
.ico svg{ width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }

/* ============================================================
   Lesson
   ============================================================ */
.lesson{
  position:fixed; inset:0; z-index:60; max-width:560px; margin:0 auto;
  background:var(--bg); display:flex; flex-direction:column;
  animation:slideUp .26s cubic-bezier(.22,.9,.3,1);
}
@keyframes slideUp{ from{ transform:translateY(18px); opacity:0 } to{ transform:none; opacity:1 } }
.lhead{
  padding:calc(8px + var(--safe-t)) 12px 8px; display:flex; align-items:center; gap:8px;
  border-bottom:1px solid var(--line); background:var(--card);
}
.lhead .lclose{ width:38px; height:38px; border-radius:50%; display:grid; place-items:center; color:var(--text-2); }
.lhead .lmeta{ flex:1; min-width:0; }
.lhead .lmeta .k{ font-size:10.5px; font-weight:800; color:var(--primary); letter-spacing:.4px; }
.lhead .lmeta .t{ font-size:14px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lsteps{ display:flex; gap:5px; padding:10px 16px 4px; }
.lsteps .s{ flex:1; height:4px; border-radius:99px; background:var(--line-strong); transition:.25s; }
.lsteps .s.on{ background:var(--primary); }
.lsteps .s.done{ background:var(--primary); opacity:.45; }
.lbody{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 16px 22px; }
.lfoot{
  padding:10px 16px calc(12px + var(--safe-b)); border-top:1px solid var(--line);
  background:var(--card); display:flex; gap:10px;
}
.steplabel{ font-size:11.5px; font-weight:800; color:var(--primary); letter-spacing:.3px; }
.stepdesc{ color:var(--text-2); font-size:13px; margin:5px 0 0; }

/* sentence card */
.scard{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:20px 18px; box-shadow:var(--shadow); margin-top:12px;
}
.scard .en{ font-size:23px; font-weight:800; line-height:1.34; letter-spacing:-.5px; }
.scard .en .hl{ color:var(--primary); }
.scard .ko{ margin-top:10px; font-size:14.5px; color:var(--text-2); line-height:1.5; }
.scard .ko.blur{ filter:blur(6px); opacity:.6; user-select:none; }
.srow{ display:flex; align-items:center; gap:8px; margin-top:16px; flex-wrap:wrap; }
.playbtn{
  display:inline-flex; align-items:center; gap:7px; padding:9px 15px 9px 12px; border-radius:99px;
  background:var(--primary); color:#fff; font-weight:800; font-size:13.5px;
  box-shadow:0 6px 16px rgba(59,110,246,.30);
}
.playbtn svg{ width:17px; height:17px; stroke:#fff; fill:none; stroke-width:2; }
.playbtn.ghost{ background:var(--primary-soft); color:var(--primary); box-shadow:none; }
.playbtn.ghost svg{ stroke:var(--primary); }
.playbtn:active{ transform:scale(.96); }
.speed{
  display:inline-flex; padding:3px; border-radius:99px; background:var(--card-2);
  border:1px solid var(--line); font-size:12px; font-weight:800; color:var(--text-2);
}
.speed button{ padding:6px 11px; border-radius:99px; }
.speed button[aria-pressed="true"]{ background:var(--card); color:var(--primary); box-shadow:var(--shadow-sm); }

.nuance{
  margin-top:16px; padding:14px 15px; border-radius:var(--r-md);
  background:var(--primary-soft); border:1px solid var(--primary-soft-2);
}
.nuance .nt{ font-size:11.5px; font-weight:900; color:var(--primary); letter-spacing:.3px; margin-bottom:5px; }
.nuance p{ margin:0; font-size:13.5px; line-height:1.6; color:var(--text); }
.tipbox{ margin-top:12px; padding:13px 15px; border-radius:var(--r-md); background:var(--card-2); border:1px solid var(--line); }
.tipbox ul{ margin:0; padding-left:17px; }
.tipbox li{ font-size:13px; color:var(--text-2); line-height:1.6; margin:2px 0; }

/* variation cards */
.vcard{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-md);
  padding:15px 15px 13px; margin-top:10px; box-shadow:var(--shadow-sm);
}
.vcard .vtop{ display:flex; align-items:flex-start; gap:10px; }
.vcard .vnum{
  flex:none; width:24px; height:24px; border-radius:8px; background:var(--primary-soft); color:var(--primary);
  display:grid; place-items:center; font-size:12px; font-weight:900; margin-top:1px;
}
.vcard .ven{ font-size:16.5px; font-weight:700; line-height:1.4; letter-spacing:-.2px; }
.vcard .vko{ font-size:13px; color:var(--text-2); margin-top:6px; line-height:1.5; }
.vcard .vnote{ font-size:12px; color:var(--text-3); margin-top:5px; }
.vacts{ display:flex; gap:7px; margin-top:11px; flex-wrap:wrap; }
.icobtn{
  display:inline-flex; align-items:center; gap:6px; padding:8px 13px; border-radius:99px;
  background:var(--card-2); border:1px solid var(--line); color:var(--text-2);
  font-size:12.5px; font-weight:800;
}
.icobtn svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.icobtn.rec{ background:var(--bad-soft); border-color:rgba(236,74,58,.3); color:var(--bad); }
.icobtn.busy{ animation:pulse 1.1s infinite; }
@keyframes pulse{ 0%,100%{ opacity:1 } 50%{ opacity:.45 } }

/* result */
.result{ margin-top:11px; padding-top:11px; border-top:1px dashed var(--line); }
.said{ font-size:12.5px; color:var(--text-2); margin-bottom:7px; }
.said b{ color:var(--text); font-weight:700; }
.marks{ font-size:14.5px; line-height:1.6; font-weight:600; }
.marks .w{ padding:1px 2px; border-radius:4px; }
.marks .ok{ color:var(--ok); }
.marks .miss{ color:var(--bad); background:var(--bad-soft); }
.mbar{ height:7px; border-radius:99px; background:var(--line); margin-top:10px; overflow:hidden; }
.mbar i{ display:block; height:100%; border-radius:99px; transition:width .4s; }
.mscore{ display:flex; align-items:center; justify-content:space-between; margin-top:7px; font-size:12px; font-weight:800; color:var(--text-2); }
.mscore .num{ font-size:17px; }
.fb{ margin-top:8px; font-size:12.5px; font-weight:700; }
.fb.good{ color:var(--ok); } .fb.mid{ color:var(--warn); } .fb.low{ color:var(--text-2); }

.txtinput{ display:flex; gap:8px; margin-top:10px; }
.txtinput input{
  flex:1; min-width:0; padding:11px 13px; border-radius:12px; border:1px solid var(--line-strong);
  background:var(--card-2); font-size:14px; outline:none;
}
.txtinput input:focus{ border-color:var(--primary); background:var(--card); }
.txtinput button{ padding:0 15px; border-radius:12px; background:var(--primary); color:#fff; font-weight:800; font-size:13px; }

/* roleplay */
.rp-sit{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); padding:17px; box-shadow:var(--shadow-sm); }
.rp-sit .label{ font-size:11px; font-weight:900; color:var(--warn); letter-spacing:.4px; }
.rp-sit p{ margin:7px 0 0; font-size:14px; line-height:1.6; }
.rp-q{ margin-top:14px; padding:15px; border-radius:var(--r-md); background:var(--primary-soft); border:1px solid var(--primary-soft-2); }
.rp-q .q{ font-size:16px; font-weight:700; line-height:1.45; }
.rp-q .qko{ font-size:12.5px; color:var(--text-2); margin-top:6px; }
.micwrap{ display:flex; flex-direction:column; align-items:center; gap:10px; margin:20px 0 6px; }
.micbig{
  width:76px; height:76px; border-radius:50%; display:grid; place-items:center;
  background:linear-gradient(145deg,#4B7BFF,#2A55D4); color:#fff;
  box-shadow:0 12px 26px rgba(59,110,246,.38); transition:.15s; position:relative;
}
.micbig svg{ width:30px; height:30px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.micbig:active{ transform:scale(.94); }
.micbig.on{ background:linear-gradient(145deg,#F0604E,#D8382A); box-shadow:0 0 0 0 rgba(236,74,58,.5); animation:ring 1.4s infinite; }
@keyframes ring{
  0%{ box-shadow:0 0 0 0 rgba(236,74,58,.45) }
  70%{ box-shadow:0 0 0 18px rgba(236,74,58,0) }
  100%{ box-shadow:0 0 0 0 rgba(236,74,58,0) }
}
.micwrap .hint{ font-size:12.5px; color:var(--text-3); font-weight:600; }
.alt{ text-align:center; margin-top:4px; }
.alt button{ font-size:12.5px; color:var(--primary); font-weight:800; text-decoration:underline; text-underline-offset:3px; }
.model{
  margin-top:16px; padding:16px; border-radius:var(--r-md); background:var(--ok-soft);
  border:1px solid rgba(15,169,104,.28);
}
.model .mt{ font-size:11px; font-weight:900; color:var(--ok); letter-spacing:.4px; }
.model .en{ font-size:16px; font-weight:700; margin-top:7px; line-height:1.5; }
.model .ko{ font-size:13px; color:var(--text-2); margin-top:6px; line-height:1.5; }
.model ul{ margin:10px 0 0; padding-left:17px; }
.model li{ font-size:12.5px; color:var(--text-2); line-height:1.55; }

/* AI box */
.aibox{ margin-top:16px; border:1px solid var(--line); border-radius:var(--r-md); background:var(--card); overflow:hidden; }
.aihead{ display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line); }
.aihead .dot{ width:9px; height:9px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 3px var(--ok-soft); }
.aihead .t{ font-size:13px; font-weight:800; flex:1; }
.aihead .t span{ display:block; font-size:11px; color:var(--text-3); font-weight:600; }
.aihead button{ font-size:12px; font-weight:800; color:var(--primary); padding:6px 10px; border-radius:9px; background:var(--primary-soft); }
.ailog{ max-height:280px; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; background:var(--card-2); }
.msg{ max-width:86%; padding:10px 12px; border-radius:14px; font-size:13.5px; line-height:1.5; white-space:pre-wrap; }
.msg.ai{ align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:5px; }
.msg.me{ align-self:flex-end; background:var(--primary); color:#fff; border-bottom-right-radius:5px; }
.msg.sys{ align-self:center; background:transparent; color:var(--text-3); font-size:11.5px; text-align:center; max-width:100%; }
.aiform{ display:flex; gap:7px; padding:9px; border-top:1px solid var(--line); background:var(--card); }
.aiform input{ flex:1; min-width:0; padding:10px 12px; border-radius:10px; border:1px solid var(--line-strong); background:var(--card-2); font-size:13.5px; outline:none; }
.aiform button{ width:40px; border-radius:10px; background:var(--primary); color:#fff; display:grid; place-items:center; }
.aiform button svg{ width:18px; height:18px; stroke:#fff; fill:none; stroke-width:2; }
.ainote{ padding:10px 14px 12px; font-size:11px; color:var(--text-3); line-height:1.5; }

/* buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:14px 18px; border-radius:14px; font-weight:800; font-size:15px; letter-spacing:-.2px;
  background:var(--card-2); color:var(--text); border:1px solid var(--line);
}
.btn.primary{ background:var(--primary); color:#fff; border-color:transparent; box-shadow:0 8px 20px rgba(59,110,246,.30); }
.btn.primary:active{ transform:scale(.98); }
.btn:disabled{ opacity:.45; }
.btn.block{ width:100%; }
.btn.sm{ padding:10px 14px; font-size:13px; border-radius:11px; }
.lesson .lfoot .btn{ flex:1; }
.lesson .lfoot .btn.ghost{ flex:0 0 auto; min-width:86px; }

/* ---------- review ---------- */
.quizhero{
  border-radius:var(--r-lg); padding:20px; color:#fff;
  background:linear-gradient(135deg,#7C5CFF,#4B47E0 60%,#3538C0);
  box-shadow:0 12px 26px rgba(76,70,220,.30); margin-top:6px;
}
.quizhero h2{ margin:0; font-size:20px; letter-spacing:-.4px; }
.quizhero p{ margin:7px 0 0; font-size:13px; opacity:.9; line-height:1.5; }
.quizhero .stat{ display:flex; gap:18px; margin-top:16px; }
.quizhero .stat div{ font-size:11.5px; opacity:.8; font-weight:700; }
.quizhero .stat b{ display:block; font-size:21px; opacity:1; margin-bottom:1px; }
.qcard{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); padding:20px 18px; box-shadow:var(--shadow); margin-top:14px; }
.qcard .qidx{ font-size:11.5px; font-weight:900; color:var(--primary); letter-spacing:.4px; }
.qcard .qko{ font-size:19px; font-weight:800; line-height:1.45; margin-top:10px; letter-spacing:-.3px; }
.qcard .qhint{ font-size:12.5px; color:var(--text-3); margin-top:8px; }

/* ---------- stats ---------- */
.statgrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
.statbox{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:15px; box-shadow:var(--shadow-sm); }
.statbox .k{ font-size:11.5px; font-weight:800; color:var(--text-3); }
.statbox .v{ font-size:26px; font-weight:900; letter-spacing:-1px; margin-top:3px; }
.statbox .v small{ font-size:13px; font-weight:800; color:var(--text-3); letter-spacing:0; }
.dots{ display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
.dot{ width:26px; height:26px; border-radius:8px; background:var(--card-3); border:1px solid var(--line); display:grid; place-items:center; font-size:9px; font-weight:800; color:var(--text-3); }
.dot.on{ background:var(--ok); border-color:var(--ok); color:#fff; }
.proglist{ margin-top:12px; display:flex; flex-direction:column; gap:12px; }
.progrow .pt{ display:flex; justify-content:space-between; font-size:13px; font-weight:800; margin-bottom:6px; }
.progrow .pt span{ color:var(--text-3); font-weight:700; font-size:12px; }
.progrow .pbar{ height:8px; border-radius:99px; background:var(--card-3); overflow:hidden; }
.progrow .pbar i{ display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#5B87FF,#3B6EF6); }

/* ---------- modal ---------- */
.modal{ position:fixed; inset:0; z-index:80; display:flex; align-items:flex-end; justify-content:center; }
.modal .backdrop{ position:absolute; inset:0; background:rgba(6,12,28,.5); backdrop-filter:blur(2px); animation:fade .2s; }
@keyframes fade{ from{opacity:0} to{opacity:1} }
.sheet{
  position:relative; width:100%; max-width:560px; max-height:88vh; overflow-y:auto;
  background:var(--card); border-radius:24px 24px 0 0; padding:8px 18px calc(20px + var(--safe-b));
  animation:sheetUp .26s cubic-bezier(.22,.9,.3,1);
}
@keyframes sheetUp{ from{ transform:translateY(40px) } to{ transform:none } }
.sheet .grab{ width:42px; height:4px; border-radius:99px; background:var(--line-strong); margin:6px auto 12px; }
.sheet h2{ margin:0 0 4px; font-size:19px; letter-spacing:-.3px; }
.sheet .sdesc{ font-size:12.5px; color:var(--text-2); margin:0 0 16px; line-height:1.5; }
.field{ margin-bottom:16px; }
.field > label{ display:block; font-size:12.5px; font-weight:800; color:var(--text-2); margin-bottom:7px; }
.field input[type=text], .field input[type=password], .field select{
  width:100%; padding:12px 13px; border-radius:12px; border:1px solid var(--line-strong);
  background:var(--card-2); font-size:14px; outline:none;
}
.field input:focus, .field select:focus{ border-color:var(--primary); }
.field .help{ font-size:11.5px; color:var(--text-3); margin-top:6px; line-height:1.5; }
.field textarea{
  width:100%; min-height:78px; padding:11px 13px; border-radius:12px; border:1px solid var(--line-strong);
  background:var(--card-2); color:var(--text); font-size:12px; line-height:1.45; outline:none; resize:vertical;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; word-break:break-all;
}
.field textarea:focus{ border-color:var(--primary); }
.btnrow{ display:flex; gap:8px; flex-wrap:wrap; }
.field .okmsg{ font-size:11.5px; color:var(--ok); margin-top:6px; line-height:1.5; font-weight:700; }
.seg{ display:flex; gap:6px; background:var(--card-3); padding:4px; border-radius:12px; }
.seg button{ flex:1; padding:9px; border-radius:9px; font-size:12.5px; font-weight:800; color:var(--text-2); }
.seg button[aria-pressed="true"]{ background:var(--card); color:var(--primary); box-shadow:var(--shadow-sm); }
.switchrow{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--line); }
.switchrow .lab{ font-size:13.5px; font-weight:700; }
.switchrow .lab span{ display:block; font-size:11.5px; color:var(--text-3); font-weight:600; margin-top:2px; }
.switch{ width:48px; height:28px; border-radius:99px; background:var(--line-strong); position:relative; transition:.2s; flex:none; }
.switch::after{ content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
.switch[aria-checked="true"]{ background:var(--primary); }
.switch[aria-checked="true"]::after{ transform:translateX(20px); }
.danger{ color:var(--bad); font-size:13.5px; font-weight:800; }
.mic-status{ display:flex; gap:8px; align-items:center; font-size:12px; font-weight:700; padding:10px 12px; border-radius:10px; background:var(--card-2); border:1px solid var(--line); }
.mic-status .dot{ width:8px; height:8px; border-radius:50%; background:var(--text-3); }
.mic-status.ok .dot{ background:var(--ok); } .mic-status.no .dot{ background:var(--warn); }

/* toast */
.toast{
  position:fixed; left:50%; bottom:calc(84px + var(--safe-b)); transform:translate(-50%,20px);
  background:#111A2E; color:#fff; padding:12px 18px; border-radius:99px; font-size:13px; font-weight:700;
  opacity:0; pointer-events:none; transition:.25s; z-index:100; max-width:88vw; text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}
[data-theme="dark"] .toast{ background:#EAF0FB; color:#0B1020; }
.toast.show{ opacity:1; transform:translate(-50%,0); }

/* completion */
.donebox{ text-align:center; padding:30px 20px; }
.donebox .big{ font-size:56px; line-height:1; animation:pop .5s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop{ from{ transform:scale(.4); opacity:0 } to{ transform:none; opacity:1 } }
.donebox h2{ margin:16px 0 6px; font-size:22px; letter-spacing:-.4px; }
.donebox p{ margin:0 auto; color:var(--text-2); font-size:13.5px; max-width:300px; line-height:1.6; }
.donebox .stats{ display:flex; justify-content:center; gap:26px; margin:22px 0 8px; }
.donebox .stats div{ font-size:11.5px; color:var(--text-3); font-weight:700; }
.donebox .stats b{ display:block; font-size:24px; color:var(--text); letter-spacing:-.5px; }

</style>
</head>

<script id="app-data" type="application/json">{"tracks":[{"id":"A","name":"비즈니스 실무","short":"실무","cardTitle":"비즈니스 실무 영어","tagline":"회의·발표·협의·업무 공유까지, 실무에서 바로 쓰는 29일","chapters":[{"id":"A","name":"비즈니스 실무 영어","subtitle":"회의 진행 · 발표 · 의견 조율 · 업무 공유","days":[{"n":0,"title":"1:1 면담 일정 잡기","key":"We should schedule a 1-on-1 meeting.","keyKo":"면담 일정을 잡는 게 좋겠어요.","nuance":"1:1 면담은 one-on-one 또는 1-on-1이라고 씁니다. should는 must보다 부드러운 제안이라 상사에게도, 동료에게도 쓸 수 있어요.","usage":"분기 목표나 커리어 이야기를 하려고 상사에게 시간을 요청할 때 가장 먼저 나오는 문장입니다.","tips":["schedule은 격식 있는 '일정을 잡다', 캐주얼하게는 set up을 씁니다.","시간을 구체적으로(30 minutes) 붙이면 답장을 받기 쉬워요."],"variations":[{"en":"Could we schedule a quick 1-on-1 this week?","ko":"이번 주에 잠깐 1:1 면담 일정을 잡을 수 있을까요?","note":"Could we ~ 로 시작하면 더 공손해요."},{"en":"Let's set up a 1-on-1 with the new hire.","ko":"신입 사원과 1:1 면담을 잡아요.","note":"set up a meeting = schedule a meeting."},{"en":"I'd like to schedule a 1-on-1 to go over my goals.","ko":"제 목표를 함께 짚어보고 싶어서 1:1 면담을 잡고 싶습니다.","note":"go over = 함께 훑어보다."}],"roleplay":{"situation":"분기 목표를 논의하고 싶어서 팀장님께 1:1 면담을 요청해야 합니다.","question":"Ask your manager for a 1-on-1 meeting this week to talk about your goals.","questionKo":"이번 주에 목표 이야기를 하려고 팀장님께 1:1 면담을 요청해 보세요.","model":"Hi, do you have 30 minutes this week? I'd like to schedule a 1-on-1 to go over my quarterly goals.","modelKo":"안녕하세요, 이번 주에 30분 시간 괜찮으실까요? 분기 목표를 함께 짚어보고 싶어서 1:1 면담을 잡고 싶습니다.","tips":["목적을 먼저 말하면 상대가 일정을 잡기 쉬워요.","30 minutes처럼 길이를 제안하면 답이 빨라집니다."]}},{"n":1,"title":"화상회의 음성이 끊길 때","key":"Your sound cuts in and out.","keyKo":"목소리가 나왔다 안 나왔다 끊겨요.","nuance":"cut in and out은 소리가 들렸다 끊겼다 반복된다는 뜻이에요. sound 대신 audio를 써도 같은 의미입니다.","usage":"화상 통화에서 상대의 말이 자꾸 끊겨 다시 말해 달라고 해야 할 때 씁니다.","tips":["Sorry를 앞에 붙이면 지적이 아니라 상황 설명처럼 들려요.","You're breaking up도 똑같이 자주 쓰는 표현입니다."],"variations":[{"en":"Sorry, you're breaking up. Can you say that again?","ko":"미안한데 목소리가 끊겨요. 다시 한번 말해줄래요?","note":"breaking up = 통화 품질이 나쁜 상태."},{"en":"I think my connection is unstable. Let me turn off my video.","ko":"연결이 불안정한 것 같아요. 영상 꺼볼게요.","note":"unstable connection = 불안정한 연결."},{"en":"Can you hear me now? I'll try reconnecting.","ko":"지금 제 말 들리세요? 다시 연결해볼게요.","note":"reconnect = 다시 접속하다."}],"roleplay":{"situation":"화상회의 중 거래처 담당자의 목소리가 계속 끊깁니다.","question":"Your client's audio keeps cutting out. What do you say?","questionKo":"거래처 담당자의 소리가 계속 끊길 때 뭐라고 말할까요?","model":"Sorry, your sound keeps cutting in and out. Could you say that one more time? I'll turn my video off to save bandwidth.","modelKo":"죄송해요, 소리가 계속 끊겨요. 한 번만 더 말씀해 주시겠어요? 대역폭을 아끼려고 영상은 꺼둘게요.","tips":["keeps cutting in and out처럼 keeps를 붙이면 반복되는 상황이 돼요.","bandwidth는 인터넷 대역폭, 회사에서는 '업무 여유'라는 뜻으로도 씁니다."]}},{"n":2,"title":"앞 회의가 늦어질 때","key":"My meeting is running over.","keyKo":"앞에 회의가 좀 늦어지고 있어요.","nuance":"run over는 정해진 시간을 넘겨 계속되다는 뜻입니다. 진행 중이면 running over로 씁니다.","usage":"다음 일정에 늦을 것 같아 미리 양해를 구할 때 문자나 통화 첫마디로 씁니다.","tips":["I'm running behind도 같은 뜻의 더 캐주얼한 표현이에요.","몇 분 늦을지 숫자로 말하면 상대가 일정을 조정하기 쉬워요."],"variations":[{"en":"Sorry, I'm running a little behind.","ko":"죄송해요, 제가 조금 늦어지고 있어요.","note":"a little behind = 조금 늦는 중."},{"en":"My previous meeting ran over. Can we start 10 minutes late?","ko":"앞 회의가 늦어졌어요. 10분 늦게 시작해도 될까요?","note":"ran over = 이미 늦어진(과거)."},{"en":"I'll be there as soon as this meeting wraps up.","ko":"이 회의 끝나는 대로 갈게요.","note":"wrap up = 마무리하다."}],"roleplay":{"situation":"앞 회의가 길어져 다음 통화에 늦을 것 같습니다.","question":"Apologize for being late to a call and give a time when you'll join.","questionKo":"통화에 늦는 것을 사과하고 언제 들어갈 수 있는지 말해 보세요.","model":"I'm so sorry — my previous meeting is running over. I'll join in about 10 minutes.","modelKo":"정말 죄송합니다. 앞 회의가 늦어지고 있어서요. 10분쯤 뒤에 들어가겠습니다.","tips":["I'll join in about ~ minutes가 가장 자연스러운 예고입니다.","사과는 짧게, 대신 언제 들어가겠다는 정보를 꼭 넣으세요."]}},{"n":3,"title":"본론에서 벗어날 때","key":"We are getting a bit sidetracked here.","keyKo":"지금 우리가 본론에서 좀 벗어나고 있어요.","nuance":"sidetracked는 원래 하던 이야기에서 옆길로 새는 것. a bit을 넣으면 지적이 훨씬 부드러워집니다.","usage":"회의가 다른 주제로 흘러갈 때, 진행자로서 자연스럽게 되돌릴 때 씁니다.","tips":["get back on track = 다시 본론으로 돌아가다.","go off on a tangent = 옆길로 새다."],"variations":[{"en":"Let's get back on track.","ko":"다시 본론으로 돌아가죠.","note":"짧고 힘 있는 진행자 표현."},{"en":"That's a good point, but let's come back to it later.","ko":"좋은 지적이에요, 근데 나중에 다시 다뤄요.","note":"상대 의견을 인정하고 미루는 방식."},{"en":"Sorry, I think we're going off on a tangent.","ko":"죄송해요, 우리가 옆길로 새는 것 같아요.","note":"tangent = 본론에서 벗어난 이야기."}],"roleplay":{"situation":"예산 회의가 갑자기 사무실 인테리어 이야기로 흘렀습니다.","question":"Bring the meeting back to the budget topic politely.","questionKo":"회의를 예산 주제로 부드럽게 되돌려 보세요.","model":"Sorry to interrupt — I think we're getting a bit sidetracked. Can we get back to the budget issue?","modelKo":"끼어들어 죄송해요. 우리가 좀 옆길로 새는 것 같아요. 예산 문제로 다시 돌아갈 수 있을까요?","tips":["Sorry to interrupt로 시작하면 끼어드는 부담이 줄어요.","되돌릴 주제를 마지막에 콕 집어 말하세요."]}},{"n":4,"title":"이메일 전달·참조","key":"I forwarded the email for your reference.","keyKo":"참고하시라고 이메일을 포워드 해드렸어요.","nuance":"forward는 받은 메일을 그대로 넘기는 것, cc는 참조로 넣는 것. for your reference는 '참고하시라고'라는 뜻입니다.","usage":"거래처와 주고받은 메일을 상사나 관련 팀에 공유할 때 씁니다.","tips":["FYI(for your information)도 같은 역할의 줄임말이에요.","loop someone in = 특정 사람을 대화에 끌어들이다."],"variations":[{"en":"I've cc'd you on the email.","ko":"그 메일에 참조로 넣었습니다.","note":"cc = 참조, bcc = 숨은 참조."},{"en":"I forwarded you the file — please take a look when you get a chance.","ko":"파일 전달드렸어요, 시간 되실 때 봐주세요.","note":"when you get a chance = 시간 될 때."},{"en":"I'm looping in the design team for their reference.","ko":"디자인팀도 참고하라고 참조에 넣을게요.","note":"loop in = 대화에 포함시키다."}],"roleplay":{"situation":"수정된 계약서를 거래처에 보내고, 같은 내용을 팀장님께도 전달했습니다.","question":"Tell your manager that you sent the revised contract to the client and forwarded it to them.","questionKo":"거래처에 수정 계약서를 보냈고 팀장님께도 전달했다고 말해 보세요.","model":"I just sent the revised contract to the client and forwarded it to you for your reference.","modelKo":"방금 거래처에 수정 계약서를 보냈고, 참고하시라고 팀장님께도 전달드렸습니다.","tips":["revised = 수정된, updated도 같은 뜻으로 씁니다.","보낸 대상과 전달한 대상을 순서 opic.","keyKo":"이제 다음 주제로 넘어가겠습니다.","nuance":"발표의 뼈대는 목적 → 근거 → 전환 → 마무리입니다. 순서를 기억하면 내용이 바뀌어도 말할 수 있어요.","usage":"발표 전체를 1분으로 압축해서 말해 보세요.","tips":["목적·수치·전환·마무리를 각각 한 문장으로 말해 보세요.","막히면 Day 7~11로 돌아가 반복하세요."],"variations":[{"en":"The goal of this presentation is to outline our marketing strategy.","ko":"발표의 취지는 마케팅 전략을 설명하는 것입니다.","note":"Day 7 · 목적."},{"en":"We could see as much as a 20% increase in productivity.","ko":"무려 20%의 생산성 증가를 기대할 수 있습니다.","note":"Day 9 · 수치."},{"en":"As you can see from this data, there's a slight bump in numbers.","ko":"데이터에서 보시다시피 수치가 약간 올랐습니다.","note":"Day 10 · 근거."},{"en":"That concludes my presentation.","ko":"이상으로 발표를 마치겠습니다.","note":"마무리 표현."}],"roleplay":{"situation":"발표를 마치고 질문을 받을 차례입니다.","question":"Close your presentation and invite questions.","questionKo":"발표를 마무리하고 질문을 청해 보세요.","model":"That concludes my presentation. Thanks for listening — any thoughts, comments, or feedback?","modelKo":"이상으로 발표를 마치겠습니다. 들어주셔서 감사합니다. 의견이나 피드백 있으신가요?","tips":["That concludes my presentation은 가장 격식 있는 마무리입니다.","질문을 청할 때 침묵이 생기면 특정인에게 눈을 맞추세요."]}},{"n":13,"title":"상대 의도 확인하기","key":"So, are you saying that you'd like to delay the decision?","keyKo":"결정을 보류하자는 말씀이신 거죠?","nuance":"are you saying that ~?은 상대 말을 내 언어로 정리해 확인하는 질문. 오해를 막는 가장 강력한 도구입니다.","usage":"협상 중 상대 요구가 애매할 때, 결정 전에 반드시 확인해야 할 때 씁니다.","tips":["Just to make sure I understand로 시작하면 더 부드러워요.","So your point is that ~도 같은 기능."],"variations":[{"en":"Just to make sure I understand — you want to push the launch to March?","ko":"제가 제대로 이해한 건지 확인차, 출시를 3월로 미루자는 말씀이시죠?","note":"push the launch = 출시를 미루다."},{"en":"So your point is that the budget is too small.","ko":"그러니까 예산이 너무 적다는 말씀이시군요.","note":"So your point is that ~ 정리 확인."},{"en":"Are you suggesting we wait another quarter?","ko":"한 분기 더 기다리자는 제안이신가요?","note":"suggest = 제안하다."}],"roleplay":{"situation":"거래처가 일정이 촉박하다고만 말하고 결정은 미루려 합니다.","question":"A client says the timeline feels rushed. Confirm what they mean before you respond.","questionKo":"거래처가 일정이 촉박하다고 합니다. 답하기 전에 의도를 확인해 보세요.","model":"So, are you saying that you'd like to delay the decision until you've seen the updated numbers?","modelKo":"그러니까 업데이트된 수치를 보실 때까지 결정을 미루고 싶다는 말씀이신가요?","tips":["상대 말을 되짚으면 감정적 대응을 피할 수 있어요.","확인 질문 뒤에는 반드시 대안을 준비하세요."]}},{"n":14,"title":"완곡하게 반대하기","key":"Don't you think the deadline is too tight?","keyKo":"마감이 너무 빠듯하다고 생각하지 않으세요?","nuance":"부정 의문문은 단정적인 반대를 부드럽게 만듭니다. tight는 시간·예산이 빠듯하다는 뜻이에요.","usage":"상사의 제안에 정면 반박 대신 의문형으로 우려를 전달할 때 씁니다.","tips":["With all due respect는 격식 있는 반대의 시작.","realistic = 현실적인."],"variations":[{"en":"I'm not sure that timeline is realistic.","ko":"그 일정이 현실적이라고 생각하지 않아요.","note":"I'm not sure ~ 로 완곡하게."},{"en":"Isn't that a bit too aggressive?","ko":"그건 좀 무리 아닐까요?","note":"aggressive = (일정이) 빡빡한."},{"en":"With all due respect, I think we need more time.","ko":"외람되지만 시간이 더 필요할 것 같습니다.","note":"격식 있는 반대 표현."}],"roleplay":{"situation":"상사가 2주 안에 끝내자고 합니다. 무리라고 생각됩니다.","question":"Disagree with a two-week deadline politely.","questionKo":"2주 마감이 무리라고 정중하게 반대해 보세요.","model":"Don't you think the deadline is too tight? Two weeks may not be enough to test everything properly.","modelKo":"마감이 너무 빠듯하지 않으세요? 2주로는 모든 걸 제대로 테스트하기 어려울 것 같습니다.","tips":["이유를 숫자나 절차로 붙이면 반대가 설득력 있어져요.","may not be enough는 단정 대신 가능성으로 말합니다."]}},{"n":15,"title":"대안 제안하기","key":"What if we run a promotion?","keyKo":"프로모션을 진행해 보면 어때요?","nuance":"What if we ~?는 회의에서 가장 자주 쓰는 제안 표현. 상대를 몰아붙이지 않고 선택지를 던집니다.","usage":"문제를 지적만 하지 않고 해결책을 꺼낼 때 씁니다.","tips":["How about we ~?도 같은 뜻으로 더 캐주얼해요.","run a promotion = 프로모션을 진행하다."],"variations":[{"en":"What if we split the cost 50/50?","ko":"비용을 반반 나누면 어때요?","note":"split = 나누다."},{"en":"How about we test it with one store first?","ko":"한 매장에서 먼저 테스트해보는 건 어때요?","note":"How about we ~? 캐주얼 제안."},{"en":"What if we push the launch back a week?","ko":"출시를 일주일 미루면 어때요?","note":"push back = 미루다."}],"roleplay":{"situation":"재고가 쌓였습니다. 새 모델 출시 전에 처리할 방법을 제안하세요.","question":"Propos /* Speak Daily — app logic (vanilla JS, no dependencies) */
(function () {
  'use strict';

  /* ---------------- data & state ---------------- */
  var DATA = JSON.parse(document.getElementById('app-data').textContent);
  var LS_KEY = 'speakdaily.v1';
  var DAYS = [];
  var TRACK = {};
  var CH = {};

  var S = {
    track: 'A',
    chapter: {},
    progress: {},
    days: {},
    streak: { count: 0, last: '' },
    settings: { theme: 'system', rate: 1, apiKey: '', autoPlay: true, hideKo: false }
  };

  var UI = { tab: 'home' };
  var L = null;               // lesson state
  var R = null;               // review state
  var rate = 1;               // current playback rate in lesson

  /* ---------------- tiny helpers ---------------- */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function todayStr(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function shiftDay(str, delta) {
    var p = str.split('-');
    var dt = new Date(+p[0], +p[1] - 1, +p[2]);
    dt.setDate(dt.getDate() + delta);
    return todayStr(dt);
  }
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  /* ---------------- icons ---------------- */
  var I = {
    play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.3c0-.8.9-1.3 1.6-.9l9.2 6.7c.6.4.6 1.4 0 1.8l-9.2 6.7c-.7.4-1.6-.1-1.6-.9V5.3z"/></svg>',
    speaker: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1z"/><path d="M15.5 8.6a4.6 4.6 0 0 1 0 6.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>',
    mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18.2V21"/></svg>',
    keys: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="7" width="19" height="10" rx="2.4"/><path d="M6.5 11h.01M10 11h.01M13.5 11h.01M17 11h.01M8 14h8"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.5l5 5 10-11"/></svg>',
    send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5L4 12z"/></svg>',
    book: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10a3 3 0 0 1 2 5.2V20a3 3 0 0 0-2-1H5.5A1.5 1.5 0 0 1 4 17.5v-12z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H14a3 3 0 0 0-2 5.2V20a3 3 0 0 1 2-1h4.5a1.5 1.5 0 0 0 1.5-1.5v-12z"/></svg>',
    loop: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a7 7 0 0 1 12-4l2 2"/><path d="M18 4v4h-4"/><path d="M20 14a7 7 0 0 1-12 4l-2-2"/><path d="M6 20v-4h4"/></svg>',
    chart: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5h16"/><path d="M7 19V11"/><path d="M12 19V5.5"/><path d="M17 19v-5"/></svg>',
    gear: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.88V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
    close: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    back: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>'
  };

  /* ---------------- build index ---------------- */
  DATA.tracks.forEach(function (t) {
    TRACK[t.id] = t;
    S.chapter[t.id] = S.chapter[t.id] || (t.chapters[0] && t.chapters[0].id);
    t.chapters.forEach(function (ch) {
      CH[ch.id] = { ch: ch, track: t };
      ch.days.forEach(function (d, i) {
        d.id = ch.id + '-' + (d.n == null ? i : d.n);
        d.chapterId = ch.id;
        d.trackId = t.id;
        DAYS.push(d);
      });
    });
  });
  function dayById(id) {
    for (var i = 0; i < DAYS.length; i++) if (DAYS[i].id === id) return DAYS[i];
    return null;
  }
  function trackDays(tid) {
    var out = [];
    TRACK[tid].chapters.forEach(function (ch) { out = out.concat(ch.days); });
    return out;
  }

  /* ---------------- persistence ---------------- */
  function load() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) {
        var o = JSON.parse(raw);
        if (o && typeof o === 'object') {
          if (o.progress) S.progress = o.progress;
          if (o.days) S.days = o.days;
          if (o.streak) S.streak = o.streak;
          if (o.settings) S.settings = Object.assign(S.settings, o.settings);
          if (o.track && TRACK[o.track]) S.track = o.track;
          if (o.chapter) S.chapter = Object.assign(S.chapter, o.chapter);
        }
      }
    } catch (e) { /* ignore corrupted storage */ }
  }
  function save() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({
        progress: S.progress, days: S.days, streak: S.streak,
        settings: S.settings, track: S.track, chapter: S.chapter
      }));
    } catch (e) { /* storage full or blocked */ }
  }

  /* ---------------- theme ---------------- */
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function applyTheme() {
    var t = S.settings.theme || 'system';
    var dark = t === 'dark' || (t === 'system' && mq && mq.matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#080D1A' : '#F2F5FC');
  }
  if (mq && mq.addEventListener) mq.addEventListener('change', applyTheme);

  /* ---------------- streak ---------------- */
  function currentStreak() {
    var t = todayStr();
    if (S.streak.last === t) return S.streak.count || 0;
    if (S.streak.last === shiftDay(t, -1)) return S.streak.count || 0;
    return 0;
  }
  function bumpStreak() {
    var t = todayStr();
    S.days[t] = (S.days[t] || 0) + 1;
    if (S.streak.last === t) return;
    S.streak.count = (S.streak.last === shiftDay(t, -1)) ? (S.streak.count || 0) + 1 : 1;
    S.streak.last = t;
  }

  /* ---------------- speech synthesis ---------------- */
  var voices = [];
  function refreshVoices() {
    try { voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; } catch (e) { voices = []; }
  }
  if ('speechSynthesis' in window) {
    refreshVoices();
    window.speechSynthesis.onvoiceschanged = refreshVoices;
  }
  function pickVoice() {
    var prefs = ['Google US English', 'Samantha', 'Ava', 'Allison', 'Microsoft Aria Online (Natural)',
      'Microsoft Jenny Online (Natural)', 'Microsoft Zira', 'Karen', 'Daniel', 'Alex'];
    for (var i = 0; i < prefs.length; i++) {
      for (var j = 0; j < voices.length; j++) if (voices[j].name === prefs[i]) return voices[j];
    }
    for (var k = 0; k < voices.length; k++) if (/^en[-_]US/i.test(voices[k].lang)) return voices[k];
    for (var m = 0; m < voices.length; m++) if (/^en/i.test(voices[m].lang)) return voices[m];
    return null;
  }
  function speak(text, r) {
    if (!('speechSynthesis' in window)) { toast('이 브라우저는 음성 재생을 지원하지 않아요.'); return; }
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      var v = pickVoice();
      if (v) u.voice = v;
      u.lang = (v && v.lang) || 'en-US';
      u.rate = r || rate || S.settings.rate || 1;
      u.pitch = 1;
      window.speechSynthesis.speak(u);
    } catch (e) { toast('음성을 재생하지 못했어요.'); }
  }

  /* ---------------- speech recognition ---------------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recog = null;
  function srSupported() { return !!SR; }
  function listen(onResult, onEnd) {
    if (!SR) return null;
    try {
      if (recog) { try { recog.abort(); } catch (e) {} }
      var r = new SR();
      r.lang = 'en-US';
      r.interimResults = false;
      r.maxAlternatives = 1;
      r.continuous = false;
      var done = false;
      r.onresult = function (ev) {
        done = true;
        var txt = '';
        for (var i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript + ' ';
        onResult(txt.trim());
      };
      r.onerror = function (ev) {
        done = true;
        onEnd && onEnd(ev.error || 'error');
      };
      r.onend = function () { if (!done) onEnd && onEnd('no-speech'); };
      recog = r;
      r.start();
      return r;
    } catch (e) {
      onEnd && onEnd('start-failed');
      return null;
    }
  }

  /* ---------------- answer scoring ---------------- */
  var CONTR = {
    "i'm": 'i am', "i've": 'i have', "i'll": 'i will', "i'd": 'i would',
    "you're": 'you are', "you've": 'you have', "you'll": 'you will', "you'd": 'you would',
    "we're": 'we are', "we've": 'we have', "we'll": 'we will', "we'd": 'we would',
    "they're": 'they are', "they've": 'they have', "they'll": 'they will',
    "he's": 'he is', "she's": 'she is', "it's": 'it is', "that's": 'that is',
    "there's": 'there is', "what's": 'what is', "let's": 'let us',
    "don't": 'do not', "doesn't": 'does not', "didn't": 'did not',
    "can't": 'cannot', "couldn't": 'could not', "won't": 'will not',
    "wouldn't": 'would not', "shouldn't": 'should not', "isn't": 'is not',
    "aren't": 'are not', "wasn't": 'was not', "weren't": 'were not',
    "haven't": 'have not', "hasn't": 'has not', "hadn't": 'had not',
    "i'm gonna": 'i am going to', "gonna": 'going to', "wanna": 'want to', "gotta": 'got to'
  };
  function cleanWord(w) {
    return String(w).toLowerCase().replace(/[’‘`]/g, "'").replace(/^[^a-z0-9']+|[^a-z0-9']+$/g, '');
  }
  function expand(s) {
    var orig = String(s).replace(/[’‘`]/g, "'").replace(/\s+/g, ' ').trim().split(' ').filter(Boolean);
    var words = [], map = [];
    orig.forEach(function (w, i) {
      var c = cleanWord(w);
      if (!c) { map.push(i); return; }
      var m = CONTR[c];
      if (m) { m.split(' ').forEach(function (x) { words.push(x); map.push(i); }); }
      else { words.push(c); map.push(i); }
    });
    return { orig: orig, words: words, map: map };
  }
  function evaluate(target, said) {
    var t = expand(target), s = expand(said);
    var n = t.words.length, m = s.words.length;
    var dp = [], i, j;
    for (i = 0; i <= n; i++) { dp[i] = []; for (j = 0; j <= m; j++) dp[i][j] = 0; }
    for (i = 1; i <= n; i++) {
      for (j = 1; j <= m; j++) {
        dp[i][j] = t.words[i - 1] === s.words[j - 1]
          ? dp[i - 1][j - 1] + 1
          : Math.max(dp[i - 1][j], dp[i][j - 1]);
      }
    }
    var ok = new Array(n).fill(false);
    var a = n, b = m;
    while (a > 0 && b > 0) {
      if (t.words[a - 1] === s.words[b - 1]) { ok[a - 1] = true; a--; b--; }
      else if (dp[a - 1][b] >= dp[a][b - 1]) a--; else b--;
    }
    // map expanded matches back to original words
    var origOk = new Array(t.orig.length).fill(false);
    for (i = 0; i < n; i++) { if (ok[i]) origOk[t.map[i]] = true; }
    for (i = 0; i < t.orig.length; i++) { if (!cleanWord(t.orig[i])) origOk[i] = true; }
    var matched = dp[n][m];
    var pct = n ? Math.round(matched / n * 100) : 0;
    var marks = t.orig.map(function (w, k) {
      return '<span class="w ' + (origOk[k] ? 'ok' : 'miss') + '">' + esc(w) + '</span>';
    }).join(' ');
    return { pct: pct, matched: matched, total: n, marks: marks, origOk: origOk };
  }
  function feedback(pct) {
    if (pct >= 95) return ['good', '완벽해요! 원어민과 거의 같아요.'];
    if (pct >= 80) return ['good', '아주 좋아요. 강세만 조금 더 신경 써 보세요.'];
    if (pct >= 60) return ['mid', '들렸어요. 빠진 단어를 다시 한 번 말해 보세요.'];
    if (pct >= 35) return ['mid', '핵심 단어는 맞았어요. 문장을 다시 듣고 천천히 따라 해 보세요.'];
    return ['low', '조금 더 또박또박! 먼저 듣고, 한 구절씩 나눠서 말해 보세요.'];
  }
  function resultHtml(target, said) {
    var ev = evaluate(target, said);
    var f = feedback(ev.pct);
    var color = ev.pct >= 80 ? 'var(--ok)' : ev.pct >= 55 ? 'var(--warn)' : 'var(--bad)';
    return '<div class="result">' +
      '<div class="said">내가 말한 문장 · <b>' + esc(said) + '</b></div>' +
      '<div class="marks">' + ev.marks + '</div>' +
      '<div class="mbar"><i style="width:' + ev.pct + '%;background:' + color + '"></i></div>' +
      '<div class="mscore"><span class="num" style="color:' + color + '">' + ev.pct + '%</span>' +
      '<span>' + ev.matched + '/' + ev.total + ' 단어 일치</span></div>' +
      '<div class="fb ' + f[0] + '">' + f[1] + '</div>' +
      '</div>';
  }

  /* ---------------- chrome (topbar streak, tabs) ---------------- */
  function updateChrome() {
    var st = currentStreak();
    $('#streakNum').textContent = st;
    $('#streakBox').title = st > 0 ? st + '일 연속 학습 중' : '오늘 학습하고 불꽃을 켜 보세요';
    $$('.tabbar button').forEach(function (b) {
      var on = b.getAttribute('data-tab') === UI.tab && !L;
      if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
  }

  /* ---------------- home ---------------- */
  function renderHome() {
    var t = TRACK[S.track];
    var all = trackDays(S.track);
    var done = all.filter(function (d) { return S.progress[d.id] && S.progress[d.id].done; }).length;
    var pct = all.length ? Math.round(done / all.length * 100) : 0;
    var chId = S.chapter[S.track];
    if (!CH[chId]) { chId = t.chapters[0].id; S.chapter[S.track] = chId; }
    var ch = CH[chId];

    var html = '';
    html += '<div class="h1">오늘도 한 문장, <em>입 밖으로</em></div>';
    html += '<p class="sub">스픽 3단계로 5분 스피킹 · ' + DAYS.length + '개 레슨</p>';

    html += '<div class="tracktabs" role="tablist" aria-label="트랙 선택">';
    DATA.tracks.forEach(function (tr) {
      html += '<button role="tab" data-act="track" data-track="' + tr.id + '" aria-selected="' +
        (tr.id === S.track) + '">' + tr.id + ' · ' + esc(tr.short) +
        '<span class="tnum">' + trackDays(tr.id).length + '일</span></button>';
    });
    html += '</div>';

    var nextDay = null;
    for (var di = 0; di < ch.ch.days.length; di++) {
      var dd = ch.ch.days[di];
      if (!(S.progress[dd.id] && S.progress[dd.id].done)) { nextDay = dd; break; }
    }

    html += '<div class="trackcard">' +
      '<h2>' + esc(t.cardTitle || t.name) + '</h2>' +
      '<p>' + esc(t.tagline) + '</p>' +
      '<div class="tc-bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="tc-foot"><span>진행률 ' + pct + '%</span><span>' + done + ' / ' + all.length + ' 완료</span></div>' +
      '</div>';

    if (nextDay) {
      html += '<div style="margin-top:14px"><button class="btn primary block" data-act="day" data-day="' + nextDay.id + '">' +
        '이어서 학습 · Day ' + nextDay.n + '</button></div>';
    } else {
      html += '<div class="tipbox" style="margin-top:14px;text-align:center"><p style="margin:0;font-size:13px;color:var(--text-2)">이 코스의 모든 Day를 완료했어요 🎉 복습 탭에서 다시 말해 보세요.</p></div>';
    }

    if (t.chapters.length > 1) {
      html += '<div class="chips" role="tablist" aria-label="코스 선택">';
      t.chapters.forEach(function (c) {
        var cd = c.days.filter(function (d) { return S.progress[d.id] && S.progress[d.id].done; }).length;
        html += '<button role="tab" class="chip" data-act="chapter" data-ch="' + c.id + '" aria-selected="' +
          (c.id === chId) + '">' + esc(c.name) + '<span class="cnt">' + cd + '/' + c.days.length + '</span></button>';
      });
      html += '</div>';
      if (ch.ch.subtitle) html += '<p class="sub" style="margin-top:10px">' + esc(ch.ch.subtitle) + '</p>';
    }

    html += '<div class="section-title">' + esc(ch.ch.name) + ' · ' + ch.ch.days.length + ' Day</div>';
    html += '<div class="daygrid">';
    ch.ch.days.forEach(function (d) {
      var p = S.progress[d.id];
      html += '<button class="daycard' + (p && p.done ? ' done' : '') + (d.review ? ' review' : '') +
        '" data-act="day" data-day="' + d.id + '">' +
        '<span class="badge">' + I.check.replace('<svg', '<svg style="width:12px;height:12px"') + '</span>' +
        '<span class="dnum">Day ' + d.n + '</span>' +
        '<span class="dtitle">' + esc(d.title) + '</span>' +
        '<span class="dkey">' + esc(d.key) + '</span>' +
        '</button>';
    });
    html += '</div>';
    $('#main').innerHTML = html;
  }

  /* ---------------- lesson ---------------- */
  function openLesson(dayId) {
    var d = dayById(dayId);
    if (!d) return;
    rate = S.settings.rate || 1;
    L = { day: d, step: 1, res: {}, self: {}, rp: { said: '', revealed: false, pct: null }, ai: [], aiOpen: false, aiBusy: false, input: {} };
    var el = $('#lesson');
    el.hidden = false;
    document.body.style.overflow = 'hidden';
    renderLesson();
    if (S.settings.autoPlay) setTimeout(function () { speak(d.key); }, 320);
    updateChrome();
  }
  function closeLesson() {
    L = null;
    $('#lesson').hidden = true;
    $('#lesson').innerHTML = '';
    document.body.style.overflow = '';
    if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
    render();
  }

  function renderLesson() {
    if (!L) return;
    var d = L.day;
    var step = L.step;
    var body = '', foot = '';

    var head =
      '<div class="lhead">' +
      '<button class="lclose" data-act="back" aria-label="뒤로">' + I.back.replace('<svg', '<svg style="width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"') + '</button>' +
      '<div class="lmeta"><div class="k">' + esc(trackName(d.trackId)) + ' · Day ' + d.n + '</div>' +
      '<div class="t">' + esc(d.title) + '</div></div>' +
      '<button class="lclose" data-act="settings" aria-label="설정">' + I.gear.replace('<svg', '<svg style="width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8"') + '</button>' +
      '</div>';

    var steps = '<div class="lsteps">';
    for (var i = 1; i <= 3; i++) {
      steps += '<div class="s' + (i === step ? ' on' : i < step ? ' done' : '') + '"></div>';
    }
    steps += '</div>';

    if (step === 1) { body = step1Html(d); foot = footHtml(1); }
    else if (step === 2) { body = step2Html(d); foot = footHtml(2); }
    else if (step === 3) { body = step3Html(d); foot = footHtml(3); }
    else { body = doneHtml(d); foot = '<button class="btn primary block" data-act="home">홈으로</button>'; }

    $('#lesson').innerHTML = '<div style="display:flex;flex-direction:column;height:100%">' + head + steps +
      '<div class="lbody" id="lbody">' + body + '</div>' +
      '<div class="lfoot">' + foot + '</div></div>';
    var lb = $('#lbody');
    if (lb) lb.scrollTop = 0;
  }
  function trackName(tid) {
    var t = TRACK[tid];
    if (!t) return '';
    var c = CH[L && L.day ? L.day.chapterId : ''];
    if (t.id === 'C' && c && c.ch) return c.ch.name;
    return t.short || t.name;
  }

  function footHtml(step) {
    var prev = step > 1 ? '<button class="btn ghost" data-act="prev">이전</button>' : '<button class="btn ghost" data-act="back">나가기</button>';
    var next = step < 3 ? '<button class="btn primary" data-act="next">다음 단계</button>'
      : '<button class="btn primary" data-act="complete">학습 완료</button>';
    return prev + next;
  }

  function speedCtl() {
    return '<div class="speed" role="group" aria-label="재생 속도">' +
      '<button data-act="rate" data-rate="0.8" aria-pressed="' + (rate === 0.8) + '">0.8x</button>' +
      '<button data-act="rate" data-rate="1" aria-pressed="' + (rate === 1) + '">1.0x</button>' +
      '</div>';

        (rp.tips && rp.tips.length ? '<ul>' + rp.tips.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' : '') +
        '<div class="vacts" style="margin-top:12px"><button class="icobtn" data-act="say" data-say="' + esc(rp.model) + '">' + I.speaker + ' 모범 답안 듣기</button></div>' +

      '<button data-act="ai-toggle">' + (L.aiOpen ? '닫기' : '열기') + '</button></div>';
    if (L.aiOpen) {

          '<div style="padding:0 12px 14px"><button class="btn sm primary" data-act="settings">API 키 설정하기</button></div>';
      } else {
        h += '<div class="ailog" id="ailog">';
        if (!L.ai.length) {
          h += '<div class="msg sys">아래에 영어로 말을 걸어 보세요. AI가 이어서 대화하고, 문법은 한국어로 짧게 교정해 줘요.</div>';
        }
        L.ai.forEach(function (m) { h += '<div class="msg ' + m.role + '">' + esc(m.text) + '</div>'; });
        if (L.aiBusy) h += '<div class="msg ai">…</div>';
        h += '</div>';
        h += '<div class="aiform"><input type="text" id="ai-input" autocomplete="off" placeholder="영어로 입력 (또는 마이크 버튼으로 말하기)" aria-label="AI에게 보낼 메시지">' +
          '<button data-act="ai-send" aria-label="보내기">' + I.send + '</button></div>' +
          '<div class="ainote">키는 이 브라우저에만 저장됩니다. 요금은 사용자 OpenAI 계정으로 청구돼요.</div>';
      }

  function doneHtml(d) {
    var st = currentStreak();
    var doneCount = DAYS.filter(function (x) { return S.progress[x.id] && S.progress[x.id].done; }).length;
    return '<div class="donebox">' +
      '<div class="big">🎉</div>' +
      '<h2>Day ' + d.n + ' 완료!</h2>' +
      '<p>' + esc(d.key) + '<br><span style="color:var(--text-3)">' + esc(d.keyKo) + '</span></p>' +
      '<div class="stats"><div><b>' + st + '</b>연속 일수</div><div><b>' + doneCount + '</b>완료한 Day</div></div>' +
      '<p style="margin-top:10px;font-size:12.5px;color:var(--text-3)">내일도 이어서 하면 불꽃이 커져요. 복습 탭에서 오늘 배운 문장을 다시 확인해 보세요.</p>' +
      '<div style="margin-top:18px"><button class="btn sm" data-act="uncomplete">완료 표시 취소</button></div>' +
      '</div>';

  function completeDay() {
    if (!L) return;
    var id = L.day.id;
    var pcts = [];
    Object.keys(L.res).forEach(function (k) { var e = evaluate(L.day.variations[+k].en, L.res[k].said); pcts.push(e.pct); });
    if (L.rp.said) pcts.push(evaluate(L.day.roleplay.model, L.rp.said).pct);
    var avg = pcts.length ? Math.round(pcts.reduce(function (a, b) { return a + b; }, 0) / pcts.length) : 0;
    S.progress[id] = { done: true, at: todayStr(), score: avg };
    bumpStreak();
    save();
    L.step = 4;
    renderLesson();
    updateChrome();
  }

  /* mic / answer handling */
  function handleMic(btn) {
    if (!srSupported()) {
      toast('이 브라우저는 음성 인식을 지원하지 않아요. 직접 입력을 사용해 주세요.');
      var i0 = btn.getAttribute('data-i');
      if (i0 != null) toggleType(i0, true);
      return;
    }
    var targetNow = btn.getAttribute('data-target') || 'var';
    if (!L && targetNow !== 'review') return;
    if (!R && targetNow === 'review') return;
    if (btn.classList.contains('busy')) return;
    try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {}
    var target = btn.getAttribute('data-target') || 'var';
    var i = btn.getAttribute('data-i');
    btn.classList.add('busy');
    if (btn.classList.contains('micbig')) btn.classList.add('on');
    var hint = $('#mic-hint');
    if (hint) hint.textContent = '듣고 있어요… 영어로 말해 보세요';
    var done = false;
    var timer = setTimeout(function () {
      if (!done) { done = true; if (recog) { try { recog.stop(); } catch (e) {} } }
    }, 9000);

    setTimeout(function () {
      listen(function (text) {
        done = true;
        clearTimeout(timer);
        btn.classList.remove('busy'); btn.classList.remove('on');
        if (hint) hint.textContent = '마이크를 누르고 영어로 답해 보세요';
        if (!text) { toast('잘 들리지 않았어요. 한 번 더 말해 볼까요?'); return; }
        if (target === 'review') {
          if (!R) return;
          R.items[R.idx].said = text;
          R.items[R.idx].pct = evaluate(R.items[R.idx].day.key, text).pct;
          renderReview();
          return;
        }
        if (target === 'rp') {
          L.rp.said = text;
          L.rp.revealed = true;
          renderLesson();
          var b2 = $('#lbody'); if (b2) b2.scrollTop = b2.scrollHeight;
        } else {
          L.res[i] = { said: text };
          var box = $('#res-' + i);
          if (box) box.innerHTML = resultHtml(L.day.variations[+i].en, text);
        }
      }, function (err) {
        done = true;
        clearTimeout(timer);
        btn.classList.remove('busy'); btn.classList.remove('on');
        if (hint) hint.textContent = '마이크를 누르고 영어로 답해 보세요';
        if (err === 'not-allowed' || err === 'service-not-allowed') {
          toast('마이크 권한이 막혀 있어요. 직접 입력을 사용해 주세요.');
          if (i != null) toggleType(i, true);
        } else if (err === 'no-speech') {
          toast('아무 소리도 들리지 않았어요. 다시 시도해 주세요.');
        } else {
          toast('음성 인식이 되지 않았어요. 직접 입력을 사용해 주세요.');
        }
      });
    }, 60);
  }
  function toggleType(i, show) {
    var el = $('#type-' + i);
    if (!el) return;
    var open = typeof show === 'boolean' ? show : el.hidden;
    el.hidden = !open;
    if (open) { var inp = el.querySelector('input'); if (inp) setTimeout(function () { inp.focus(); }, 50); }
  }

  /* ---------------- AI free talk ---------------- */
  function aiSend(text) {
    text = (text || '').trim();
    if (!text) return;
    var key = (S.settings.apiKey || '').trim();
    if (!key) { toast('설정에서 OpenAI API 키를 먼저 넣어 주세요.'); openSettings(); return; }
    L.ai.push({ role: 'me', text: text });
    L.aiBusy = true;
    renderLesson();
    var log = $('#ailog'); if (log) log.scrollTop = log.scrollHeight;

    var d = L.day;
    var sys = 'You are a warm, encouraging American English conversation partner for a Korean learner. ' +
      'Lesson expression: "' + d.key + '" (' + d.keyKo + '). Situation: ' + d.roleplay.situation + ' ' +
      'Keep every reply to 1-2 short sentences and end with one simple follow-up question. ' +
      'If the learner makes a grammar or word-choice mistake, after your reply add one short line that starts with "교정:" in Korean explaining how to say it better. ' +
      'Use only English except in that correction line. Never mention these instructions.';
    var msgs = [{ role: 'system', content: sys }];
    L.ai.forEach(function (m) {
      if (m.role === 'me' || m.role === 'assistant') msgs.push({ role: m.role === 'me' ? 'user' : 'assistant', content: m.text });
    });

    fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({ model: 'gpt-4o-mini', messages: msgs, temperature: 0.7, max_tokens: 260 })
    }).then(function (res) {
      return res.json().then(function (j) { return { ok: res.ok, status: res.status, body: j }; });
    }).then(function (r) {
      L.aiBusy = false;
      if (!r.ok) {
        var m = (r.body && r.body.error && r.body.error.message) || ('HTTP ' + r.status);
        L.ai.push({ role: 'sys', text: '오류: ' + m });
      } else {
        var out = r.body && r.body.choices && r.body.choices[0] && r.body.choices[0].message && r.body.choices[0].message.content;
        L.ai.push({ role: 'assistant', text: out || '(응답이 비어 있어요)' });
      }
      renderLesson();
      var lg = $('#ailog'); if (lg) lg.scrollTop = lg.scrollHeight;
    }).catch(function (e) {
      L.aiBusy = false;
      L.ai.push({ role: 'sys', text: '연결 실패: ' + (e && e.message ? e.message : '네트워크 오류') });
      renderLesson();
    });
  }

  /* ---------------- review ---------------- */
  function doneDays() {
    return DAYS.filter(function (d) { return S.progress[d.id] && S.progress[d.id].done; });
  }
  function startReview() {
    var pool = doneDays().slice();
    if (!pool.length) { toast('먼저 Day를 하나 완료해 주세요!'); return; }
    // shuffle
    for (var i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
    }
    var items = pool.slice(0, Math.min(5, pool.length)).map(function (d) { return { day: d, said: '', pct: null }; });
    R = { items: items, idx: 0, done: false };
    UI.tab = 'review';
    render();
  }
  function renderReview() {
    var done = doneDays();
    var h = '<div class="quizhero"><h2>스마트 리뷰</h2>' +
      '<p>완료한 Day의 핵심 문장을 무작위로 다시 말해 봅니다. 한국어 뜻만 보고 영어로 말해 보세요.</p>' +
      '<div class="stat"><div><b>' + done.length + '</b>복습 가능한 Day</div>' +
      '<div><b>' + Object.keys(S.progress).filter(function (k) { return S.progress[k].done; }).length + '</b>누적 완료</div>' +
      '<div><b>' + currentStreak() + '</b>연속 일수</div></div></div>';

    if (!R) {
      if (!done.length) {
        h += '<div class="empty"><div class="emoji">📚</div><h3>아직 복습할 레슨이 없어요</h3>' +
          '<p>학습 탭에서 Day를 하나 완료하면<br>여기에 복습 퀴즈가 쌓여요.</p>' +
          '<div style="margin-top:16px"><button class="btn primary sm" data-act="go-home">첫 레슨 시작하기</button></div></div>';
      } else {
        h += '<div style="margin-top:16px"><button class="btn primary block" data-act="review-start">복습 시작 · ' +
          Math.min(5, done.length) + '문제</button></div>';
        h += '<div class="section-title">복습할 수 있는 문장</div>';
        h += '<div class="tipbox" style="margin-top:0">';
        done.slice(-6).reverse().forEach(function (d) {
          h += '<div style="padding:9px 0;border-bottom:1px solid var(--line)">' +
            '<div style="font-size:13.5px;font-weight:700">' + esc(d.key) + '</div>' +
            '<div style="font-size:12px;color:var(--text-3);margin-top:2px">' + esc(d.title) + ' · Day ' + d.n + '</div></div>';
        });
        h += '</div>';
      }
      $('#main').innerHTML = h;
      return;
    }

    // quiz running
    if (R.done) {
