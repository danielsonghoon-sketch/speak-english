<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="description" content="스픽 3단계 학습법 기반 영어 스피킹 웹앱 — 핵심 패턴, 패턴 변형, 실전 롤플레이">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%233B6EF6'/%3E%3Cpath d='M30 38h40M30 52h28M30 66h34' stroke='white' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Speak Daily · 영어 스피킹</title>
<style>
/* ============================================================
   Speak Daily — 모바일 영어 스피킹 학습 앱
   ============================================================ */
:root{
  --bg:#F2F5FC; --bg-grad1:#EAF0FE; --bg-grad2:#F7F9FE;
  --card:#FFFFFF; --card-2:#F6F8FE; --card-3:#EEF3FE;
  --text:#0F172A; --text-2:#5B6986; --text-3:#8A97B0;
  --line:#E3E9F5; --line-strong:#D3DDF0;
  --primary:#3B6EF6; --primary-d:#2A55D4; --primary-soft:#E7EEFF; --primary-soft-2:#D8E4FF;
  --ok:#0FA968; --ok-soft:#E3F8EE;
  --warn:#F79009; --warn-soft:#FEF3E2;
  --bad:#EC4A3A; --bad-soft:#FDECEA;
  --shadow:0 8px 26px rgba(23,44,92,.08);
  --shadow-sm:0 2px 10px rgba(23,44,92,.06);
  --r-lg:22px; --r-md:16px; --r-sm:12px; --r-full:999px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
[data-theme="dark"]{
  --bg:#080D1A; --bg-grad1:#0E1730; --bg-grad2:#080D1A;
  --card:#121A2E; --card-2:#0E1526; --card-3:#18223A;
  --text:#EAF0FB; --text-2:#9DACC7; --text-3:#7A88A3;
  --line:#222D46; --line-strong:#2C3860;
  --primary:#5B87FF; --primary-d:#7CA0FF; --primary-soft:#182440; --primary-soft-2:#1E2C4E;
  --ok:#3BD68C; --ok-soft:#12291F;
  --warn:#FBBF4D; --warn-soft:#2A2114;
  --bad:#FF7A6B; --bad-soft:#2C1614;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --shadow-sm:0 2px 12px rgba(0,0,0,.28);
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
html{ background:var(--bg); }
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Segoe UI",system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button, input, textarea, select{ font-family:inherit; font-size:inherit; color:inherit; }
button{ border:0; background:none; cursor:pointer; padding:0; }
[hidden]{ display:none !important; }

.app{
  max-width:560px; margin:0 auto; min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column;
  background:linear-gradient(180deg,var(--bg-grad1) 0%, var(--bg-grad2) 260px, var(--bg) 520px);
  position:relative;
}
.app::before{
  content:""; position:fixed; inset:0; pointer-events:none;
  background:radial-gradient(720px 320px at 50% -140px, rgba(59,110,246,.20), transparent 70%);
  z-index:0;
}
[data-theme="dark"] .app::before{ background:radial-gradient(720px 320px at 50% -140px, rgba(91,135,255,.16), transparent 70%); }

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  padding:calc(10px + var(--safe-t)) 18px 10px;
  display:flex; align-items:center; gap:10px;
  background:linear-gradient(180deg, var(--bg-grad1) 60%, rgba(242,245,252,0));
  backdrop-filter:blur(8px);
}
[data-theme="dark"] .topbar{ background:linear-gradient(180deg, var(--bg) 60%, rgba(8,13,26,0)); }
.brand{ display:flex; align-items:center; gap:9px; flex:1; min-width:0; }
.brand-mark{
  width:34px; height:34px; border-radius:11px; flex:none;
  background:linear-gradient(145deg,#4B7BFF,#2A55D4);
  color:#fff; display:grid; place-items:center; font-weight:800; font-size:17px;
  box-shadow:0 6px 16px rgba(59,110,246,.35);
}
.brand-name{ font-weight:800; font-size:17px; letter-spacing:-.3px; }
.brand-sub{ font-size:11px; color:var(--text-3); font-weight:600; margin-top:-2px; }
.streak{
  display:flex; align-items:center; gap:5px; padding:7px 12px 7px 10px;
  border-radius:var(--r-full); background:var(--card); border:1px solid var(--line);
  box-shadow:var(--shadow-sm); font-weight:800; font-size:14px; flex:none;
}
.streak .flame{ font-size:15px; }
.streak small{ font-weight:700; color:var(--text-3); font-size:11px; }
.icon-btn{
  width:38px; height:38px; border-radius:50%; display:grid; place-items:center;
  background:var(--card); border:1px solid var(--line); color:var(--text-2);
  box-shadow:var(--shadow-sm); flex:none;
}

/* ---------- content ---------- */
.content{ flex:1; position:relative; z-index:1; padding:4px 16px calc(96px + var(--safe-b)); }
.section-title{ font-size:13px; font-weight:800; color:var(--text-3); letter-spacing:.4px; text-transform:uppercase; margin:22px 2px 10px; }
.h1{ font-size:24px; font-weight:800; letter-spacing:-.6px; margin:6px 2px 2px; }
.h1 em{ font-style:normal; color:var(--primary); }
.sub{ color:var(--text-2); font-size:14px; margin:4px 2px 0; }

/* ---------- track tabs ---------- */
.tracktabs{
  display:flex; gap:6px; padding:5px; margin:10px 0 4px;
  background:var(--card-3); border-radius:16px; position:relative;
}
.tracktabs button{
  flex:1; padding:11px 6px; border-radius:12px; font-weight:800; font-size:13.5px;
  color:var(--text-2); transition:.18s; line-height:1.2;
}
.tracktabs button .tnum{ display:block; font-size:10.5px; font-weight:700; color:var(--text-3); margin-top:2px; }
.tracktabs button[aria-selected="true"]{
  background:var(--card); color:var(--primary); box-shadow:0 3px 12px rgba(23,44,92,.10);
}
.tracktabs button[aria-selected="true"] .tnum{ color:var(--primary); opacity:.75; }

/* ---------- track header card ---------- */
.trackcard{
  margin-top:12px; padding:16px 18px; border-radius:var(--r-lg);
  background:linear-gradient(135deg, #3B6EF6, #2A55D4 65%, #2346B8);
  color:#fff; box-shadow:0 12px 28px rgba(43,86,214,.28); position:relative; overflow:hidden;
}
.trackcard::after{
  content:""; position:absolute; right:-40px; top:-50px; width:170px; height:170px;
  border-radius:50%; background:rgba(255,255,255,.10);
}
.trackcard h2{ margin:0; font-size:18px; letter-spacing:-.3px; }
.trackcard p{ margin:5px 0 0; font-size:12.5px; opacity:.86; line-height:1.45; }
.tc-bar{ margin-top:14px; height:8px; border-radius:99px; background:rgba(255,255,255,.24); overflow:hidden; }
.tc-bar > i{ display:block; height:100%; border-radius:99px; background:#fff; transition:width .45s ease; }
.tc-foot{ display:flex; justify-content:space-between; font-size:11.5px; font-weight:700; margin-top:7px; opacity:.9; }

/* ---------- chapter chips ---------- */
.chips{ display:flex; gap:8px; overflow-x:auto; padding:14px 2px 2px; margin:0 -2px; scrollbar-width:none; }
.chips::-webkit-scrollbar{ display:none; }
.chip{
  flex:none; padding:9px 14px; border-radius:var(--r-full); font-size:13px; font-weight:700;
  background:var(--card); border:1px solid var(--line); color:var(--text-2); white-space:nowrap;
  box-shadow:var(--shadow-sm); transition:.15s;
}
.chip[aria-selected="true"]{ background:var(--primary); border-color:var(--primary); color:#fff; box-shadow:0 6px 16px rgba(59,110,246,.32); }
.chip .cnt{ opacity:.65; font-weight:700; font-size:11.5px; margin-left:3px; }

/* ---------- day grid ---------- */
.daygrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
.daycard{
  position:relative; text-align:left; padding:14px 13px 13px; border-radius:var(--r-md);
  background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow-sm);
  display:flex; flex-direction:column; gap:7px; min-height:104px; transition:transform .12s, box-shadow .18s;
}
.daycard:active{ transform:scale(.975); }
.daycard .dnum{
  font-size:11px; font-weight:800; color:var(--primary); letter-spacing:.3px;
  display:flex; align-items:center; gap:5px;
}
.daycard .dtitle{ font-size:13.5px; font-weight:700; line-height:1.35; letter-spacing:-.2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.daycard .dkey{ font-size:11.5px; color:var(--text-3); line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-top:auto; }
.daycard.done{ background:linear-gradient(160deg,var(--ok-soft),var(--card) 75%); border-color:rgba(15,169,104,.30); }
.daycard.done .dnum{ color:var(--ok); }
.daycard .badge{
  position:absolute; top:11px; right:11px; width:20px; height:20px; border-radius:50%;
  background:var(--ok); color:#fff; display:none; place-items:center; font-size:12px; font-weight:900;
}
.daycard.done .badge{ display:grid; }
.daycard.review .dnum::before{ content:"↻"; font-size:12px; }

/* ---------- empty state / banners ---------- */
.empty{
  text-align:center; padding:42px 20px; border-radius:var(--r-lg);
  background:var(--card); border:1px dashed var(--line-strong); margin-top:16px;
}
.empty .emoji{ font-size:38px; }
.empty h3{ margin:12px 0 6px; font-size:16.5px; }
.empty p{ margin:0; color:var(--text-2); font-size:13.5px; line-height:1.55; }

/* ---------- bottom nav ---------- */
.tabbar{
  position:fixed; bottom:0; left:0; right:0; z-index:30;
  max-width:560px; margin:0 auto;
  padding:8px 14px calc(8px + var(--safe-b));
  display:flex; gap:4px;
  background:var(--card);
  background:color-mix(in srgb, var(--card) 88%, transparent);
  backdrop-filter:blur(14px) saturate(1.4);
  border-top:1px solid var(--line);
}
.tabbar button{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 0 4px;
  color:var(--text-3); font-size:10.5px; font-weight:800; border-radius:12px;
}
.tabbar button[ aria-current="page" ]{ color:var(--primary); }
.tabbar button[aria-current="page"] .ico{ background:var(--primary-soft); }
.tabbar .ico{ width:44px; height:26px; border-radius:99px; display:grid; place-items:center; transition:.18s; }
.ico svg{ width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }

/* ============================================================
   Lesson
   ============================================================ */
.lesson{
  position:fixed; inset:0; z-index:60; max-width:560px; margin:0 auto;
  background:var(--bg); display:flex; flex-direction:column;
  animation:slideUp .26s cubic-bezier(.22,.9,.3,1);
}
@keyframes slideUp{ from{ transform:translateY(18px); opacity:0 } to{ transform:none; opacity:1 } }
.lhead{
  padding:calc(8px + var(--safe-t)) 12px 8px; display:flex; align-items:center; gap:8px;
  border-bottom:1px solid var(--line); background:var(--card);
}
.lhead .lclose{ width:38px; height:38px; border-radius:50%; display:grid; place-items:center; color:var(--text-2); }
.lhead .lmeta{ flex:1; min-width:0; }
.lhead .lmeta .k{ font-size:10.5px; font-weight:800; color:var(--primary); letter-spacing:.4px; }
.lhead .lmeta .t{ font-size:14px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lsteps{ display:flex; gap:5px; padding:10px 16px 4px; }
.lsteps .s{ flex:1; height:4px; border-radius:99px; background:var(--line-strong); transition:.25s; }
.lsteps .s.on{ background:var(--primary); }
.lsteps .s.done{ background:var(--primary); opacity:.45; }
.lbody{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 16px 22px; }
.lfoot{
  padding:10px 16px calc(12px + var(--safe-b)); border-top:1px solid var(--line);
  background:var(--card); display:flex; gap:10px;
}
.steplabel{ font-size:11.5px; font-weight:800; color:var(--primary); letter-spacing:.3px; }
.stepdesc{ color:var(--text-2); font-size:13px; margin:5px 0 0; }

/* sentence card */
.scard{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:20px 18px; box-shadow:var(--shadow); margin-top:12px;
}
.scard .en{ font-size:23px; font-weight:800; line-height:1.34; letter-spacing:-.5px; }
.scard .en .hl{ color:var(--primary); }
.scard .ko{ margin-top:10px; font-size:14.5px; color:var(--text-2); line-height:1.5; }
.scard .ko.blur{ filter:blur(6px); opacity:.6; user-select:none; }
.srow{ display:flex; align-items:center; gap:8px; margin-top:16px; flex-wrap:wrap; }
.playbtn{
  display:inline-flex; align-items:center; gap:7px; padding:9px 15px 9px 12px; border-radius:99px;
  background:var(--primary); color:#fff; font-weight:800; font-size:13.5px;
  box-shadow:0 6px 16px rgba(59,110,246,.30);
}
.playbtn svg{ width:17px; height:17px; stroke:#fff; fill:none; stroke-width:2; }
.playbtn.ghost{ background:var(--primary-soft); color:var(--primary); box-shadow:none; }
.playbtn.ghost svg{ stroke:var(--primary); }
.playbtn:active{ transform:scale(.96); }
.speed{
  display:inline-flex; padding:3px; border-radius:99px; background:var(--card-2);
  border:1px solid var(--line); font-size:12px; font-weight:800; color:var(--text-2);
}
.speed button{ padding:6px 11px; border-radius:99px; }
.speed button[aria-pressed="true"]{ background:var(--card); color:var(--primary); box-shadow:var(--shadow-sm); }

.nuance{
  margin-top:16px; padding:14px 15px; border-radius:var(--r-md);
  background:var(--primary-soft); border:1px solid var(--primary-soft-2);
}
.nuance .nt{ font-size:11.5px; font-weight:900; color:var(--primary); letter-spacing:.3px; margin-bottom:5px; }
.nuance p{ margin:0; font-size:13.5px; line-height:1.6; color:var(--text); }
.tipbox{ margin-top:12px; padding:13px 15px; border-radius:var(--r-md); background:var(--card-2); border:1px solid var(--line); }
.tipbox ul{ margin:0; padding-left:17px; }
.tipbox li{ font-size:13px; color:var(--text-2); line-height:1.6; margin:2px 0; }

/* variation cards */
.vcard{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-md);
  padding:15px 15px 13px; margin-top:10px; box-shadow:var(--shadow-sm);
}
.vcard .vtop{ display:flex; align-items:flex-start; gap:10px; }
.vcard .vnum{
  flex:none; width:24px; height:24px; border-radius:8px; background:var(--primary-soft); color:var(--primary);
  display:grid; place-items:center; font-size:12px; font-weight:900; margin-top:1px;
}
.vcard .ven{ font-size:16.5px; font-weight:700; line-height:1.4; letter-spacing:-.2px; }
.vcard .vko{ font-size:13px; color:var(--text-2); margin-top:6px; line-height:1.5; }
.vcard .vnote{ font-size:12px; color:var(--text-3); margin-top:5px; }
.vacts{ display:flex; gap:7px; margin-top:11px; flex-wrap:wrap; }
.icobtn{
  display:inline-flex; align-items:center; gap:6px; padding:8px 13px; border-radius:99px;
  background:var(--card-2); border:1px solid var(--line); color:var(--text-2);
  font-size:12.5px; font-weight:800;
}
.icobtn svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.icobtn.rec{ background:var(--bad-soft); border-color:rgba(236,74,58,.3); color:var(--bad); }
.icobtn.busy{ animation:pulse 1.1s infinite; }
@keyframes pulse{ 0%,100%{ opacity:1 } 50%{ opacity:.45 } }

/* result */
.result{ margin-top:11px; padding-top:11px; border-top:1px dashed var(--line); }
.said{ font-size:12.5px; color:var(--text-2); margin-bottom:7px; }
.said b{ color:var(--text); font-weight:700; }
.marks{ font-size:14.5px; line-height:1.6; font-weight:600; }
.marks .w{ padding:1px 2px; border-radius:4px; }
.marks .ok{ color:var(--ok); }
.marks .miss{ color:var(--bad); background:var(--bad-soft); }
.mbar{ height:7px; border-radius:99px; background:var(--line); margin-top:10px; overflow:hidden; }
.mbar i{ display:block; height:100%; border-radius:99px; transition:width .4s; }
.mscore{ display:flex; align-items:center; justify-content:space-between; margin-top:7px; font-size:12px; font-weight:800; color:var(--text-2); }
.mscore .num{ font-size:17px; }
.fb{ margin-top:8px; font-size:12.5px; font-weight:700; }
.fb.good{ color:var(--ok); } .fb.mid{ color:var(--warn); } .fb.low{ color:var(--text-2); }

.txtinput{ display:flex; gap:8px; margin-top:10px; }
.txtinput input{
  flex:1; min-width:0; padding:11px 13px; border-radius:12px; border:1px solid var(--line-strong);
  background:var(--card-2); font-size:14px; outline:none;
}
.txtinput input:focus{ border-color:var(--primary); background:var(--card); }
.txtinput button{ padding:0 15px; border-radius:12px; background:var(--primary); color:#fff; font-weight:800; font-size:13px; }

/* roleplay */
.rp-sit{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); padding:17px; box-shadow:var(--shadow-sm); }
.rp-sit .label{ font-size:11px; font-weight:900; color:var(--warn); letter-spacing:.4px; }
.rp-sit p{ margin:7px 0 0; font-size:14px; line-height:1.6; }
.rp-q{ margin-top:14px; padding:15px; border-radius:var(--r-md); background:var(--primary-soft); border:1px solid var(--primary-soft-2); }
.rp-q .q{ font-size:16px; font-weight:700; line-height:1.45; }
.rp-q .qko{ font-size:12.5px; color:var(--text-2); margin-top:6px; }
.micwrap{ display:flex; flex-direction:column; align-items:center; gap:10px; margin:20px 0 6px; }
.micbig{
  width:76px; height:76px; border-radius:50%; display:grid; place-items:center;
  background:linear-gradient(145deg,#4B7BFF,#2A55D4); color:#fff;
  box-shadow:0 12px 26px rgba(59,110,246,.38); transition:.15s; position:relative;
}
.micbig svg{ width:30px; height:30px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.micbig:active{ transform:scale(.94); }
.micbig.on{ background:linear-gradient(145deg,#F0604E,#D8382A); box-shadow:0 0 0 0 rgba(236,74,58,.5); animation:ring 1.4s infinite; }
@keyframes ring{
  0%{ box-shadow:0 0 0 0 rgba(236,74,58,.45) }
  70%{ box-shadow:0 0 0 18px rgba(236,74,58,0) }
  100%{ box-shadow:0 0 0 0 rgba(236,74,58,0) }
}
.micwrap .hint{ font-size:12.5px; color:var(--text-3); font-weight:600; }
.alt{ text-align:center; margin-top:4px; }
.alt button{ font-size:12.5px; color:var(--primary); font-weight:800; text-decoration:underline; text-underline-offset:3px; }
.model{
  margin-top:16px; padding:16px; border-radius:var(--r-md); background:var(--ok-soft);
  border:1px solid rgba(15,169,104,.28);
}
.model .mt{ font-size:11px; font-weight:900; color:var(--ok); letter-spacing:.4px; }
.model .en{ font-size:16px; font-weight:700; margin-top:7px; line-height:1.5; }
.model .ko{ font-size:13px; color:var(--text-2); margin-top:6px; line-height:1.5; }
.model ul{ margin:10px 0 0; padding-left:17px; }
.model li{ font-size:12.5px; color:var(--text-2); line-height:1.55; }

/* AI box */
.aibox{ margin-top:16px; border:1px solid var(--line); border-radius:var(--r-md); background:var(--card); overflow:hidden; }
.aihead{ display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line); }
.aihead .dot{ width:9px; height:9px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 3px var(--ok-soft); }
.aihead .t{ font-size:13px; font-weight:800; flex:1; }
.aihead .t span{ display:block; font-size:11px; color:var(--text-3); font-weight:600; }
.aihead button{ font-size:12px; font-weight:800; color:var(--primary); padding:6px 10px; border-radius:9px; background:var(--primary-soft); }
.ailog{ max-height:280px; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; background:var(--card-2); }
.msg{ max-width:86%; padding:10px 12px; border-radius:14px; font-size:13.5px; line-height:1.5; white-space:pre-wrap; }
.msg.ai{ align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:5px; }
.msg.me{ align-self:flex-end; background:var(--primary); color:#fff; border-bottom-right-radius:5px; }
.msg.sys{ align-self:center; background:transparent; color:var(--text-3); font-size:11.5px; text-align:center; max-width:100%; }
.aiform{ display:flex; gap:7px; padding:9px; border-top:1px solid var(--line); background:var(--card); }
.aiform input{ flex:1; min-width:0; padding:10px 12px; border-radius:10px; border:1px solid var(--line-strong); background:var(--card-2); font-size:13.5px; outline:none; }
.aiform button{ width:40px; border-radius:10px; background:var(--primary); color:#fff; display:grid; place-items:center; }
.aiform button svg{ width:18px; height:18px; stroke:#fff; fill:none; stroke-width:2; }
.ainote{ padding:10px 14px 12px; font-size:11px; color:var(--text-3); line-height:1.5; }

/* buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:14px 18px; border-radius:14px; font-weight:800; font-size:15px; letter-spacing:-.2px;
  background:var(--card-2); color:var(--text); border:1px solid var(--line);
}
.btn.primary{ background:var(--primary); color:#fff; border-color:transparent; box-shadow:0 8px 20px rgba(59,110,246,.30); }
.btn.primary:active{ transform:scale(.98); }
.btn:disabled{ opacity:.45; }
.btn.block{ width:100%; }
.btn.sm{ padding:10px 14px; font-size:13px; border-radius:11px; }
.lesson .lfoot .btn{ flex:1; }
.lesson .lfoot .btn.ghost{ flex:0 0 auto; min-width:86px; }

/* ---------- review ---------- */
.quizhero{
  border-radius:var(--r-lg); padding:20px; color:#fff;
  background:linear-gradient(135deg,#7C5CFF,#4B47E0 60%,#3538C0);
  box-shadow:0 12px 26px rgba(76,70,220,.30); margin-top:6px;
}
.quizhero h2{ margin:0; font-size:20px; letter-spacing:-.4px; }
.quizhero p{ margin:7px 0 0; font-size:13px; opacity:.9; line-height:1.5; }
.quizhero .stat{ display:flex; gap:18px; margin-top:16px; }
.quizhero .stat div{ font-size:11.5px; opacity:.8; font-weight:700; }
.quizhero .stat b{ display:block; font-size:21px; opacity:1; margin-bottom:1px; }
.qcard{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); padding:20px 18px; box-shadow:var(--shadow); margin-top:14px; }
.qcard .qidx{ font-size:11.5px; font-weight:900; color:var(--primary); letter-spacing:.4px; }
.qcard .qko{ font-size:19px; font-weight:800; line-height:1.45; margin-top:10px; letter-spacing:-.3px; }
.qcard .qhint{ font-size:12.5px; color:var(--text-3); margin-top:8px; }

/* ---------- stats ---------- */
.statgrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
.statbox{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:15px; box-shadow:var(--shadow-sm); }
.statbox .k{ font-size:11.5px; font-weight:800; color:var(--text-3); }
.statbox .v{ font-size:26px; font-weight:900; letter-spacing:-1px; margin-top:3px; }
.statbox .v small{ font-size:13px; font-weight:800; color:var(--text-3); letter-spacing:0; }
.dots{ display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
.dot{ width:26px; height:26px; border-radius:8px; background:var(--card-3); border:1px solid var(--line); display:grid; place-items:center; font-size:9px; font-weight:800; color:var(--text-3); }
.dot.on{ background:var(--ok); border-color:var(--ok); color:#fff; }
.proglist{ margin-top:12px; display:flex; flex-direction:column; gap:12px; }
.progrow .pt{ display:flex; justify-content:space-between; font-size:13px; font-weight:800; margin-bottom:6px; }
.progrow .pt span{ color:var(--text-3); font-weight:700; font-size:12px; }
.progrow .pbar{ height:8px; border-radius:99px; background:var(--card-3); overflow:hidden; }
.progrow .pbar i{ display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#5B87FF,#3B6EF6); }

/* ---------- modal ---------- */
.modal{ position:fixed; inset:0; z-index:80; display:flex; align-items:flex-end; justify-content:center; }
.modal .backdrop{ position:absolute; inset:0; background:rgba(6,12,28,.5); backdrop-filter:blur(2px); animation:fade .2s; }
@keyframes fade{ from{opacity:0} to{opacity:1} }
.sheet{
  position:relative; width:100%; max-width:560px; max-height:88vh; overflow-y:auto;
  background:var(--card); border-radius:24px 24px 0 0; padding:8px 18px calc(20px + var(--safe-b));
  animation:sheetUp .26s cubic-bezier(.22,.9,.3,1);
}
@keyframes sheetUp{ from{ transform:translateY(40px) } to{ transform:none } }
.sheet .grab{ width:42px; height:4px; border-radius:99px; background:var(--line-strong); margin:6px auto 12px; }
.sheet h2{ margin:0 0 4px; font-size:19px; letter-spacing:-.3px; }
.sheet .sdesc{ font-size:12.5px; color:var(--text-2); margin:0 0 16px; line-height:1.5; }
.field{ margin-bottom:16px; }
.field > label{ display:block; font-size:12.5px; font-weight:800; color:var(--text-2); margin-bottom:7px; }
.field input[type=text], .field input[type=password], .field select{
  width:100%; padding:12px 13px; border-radius:12px; border:1px solid var(--line-strong);
  background:var(--card-2); font-size:14px; outline:none;
}
.field input:focus, .field select:focus{ border-color:var(--primary); }
.field .help{ font-size:11.5px; color:var(--text-3); margin-top:6px; line-height:1.5; }
.field textarea{
  width:100%; min-height:78px; padding:11px 13px; border-radius:12px; border:1px solid var(--line-strong);
  background:var(--card-2); color:var(--text); font-size:12px; line-height:1.45; outline:none; resize:vertical;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; word-break:break-all;
}
.field textarea:focus{ border-color:var(--primary); }
.btnrow{ display:flex; gap:8px; flex-wrap:wrap; }
.field .okmsg{ font-size:11.5px; color:var(--ok); margin-top:6px; line-height:1.5; font-weight:700; }
.seg{ display:flex; gap:6px; background:var(--card-3); padding:4px; border-radius:12px; }
.seg button{ flex:1; padding:9px; border-radius:9px; font-size:12.5px; font-weight:800; color:var(--text-2); }
.seg button[aria-pressed="true"]{ background:var(--card); color:var(--primary); box-shadow:var(--shadow-sm); }
.switchrow{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--line); }
.switchrow .lab{ font-size:13.5px; font-weight:700; }
.switchrow .lab span{ display:block; font-size:11.5px; color:var(--text-3); font-weight:600; margin-top:2px; }
.switch{ width:48px; height:28px; border-radius:99px; background:var(--line-strong); position:relative; transition:.2s; flex:none; }
.switch::after{ content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
.switch[aria-checked="true"]{ background:var(--primary); }
.switch[aria-checked="true"]::after{ transform:translateX(20px); }
.danger{ color:var(--bad); font-size:13.5px; font-weight:800; }
.mic-status{ display:flex; gap:8px; align-items:center; font-size:12px; font-weight:700; padding:10px 12px; border-radius:10px; background:var(--card-2); border:1px solid var(--line); }
.mic-status .dot{ width:8px; height:8px; border-radius:50%; background:var(--text-3); }
.mic-status.ok .dot{ background:var(--ok); } .mic-status.no .dot{ background:var(--warn); }

/* toast */
.toast{
  position:fixed; left:50%; bottom:calc(84px + var(--safe-b)); transform:translate(-50%,20px);
  background:#111A2E; color:#fff; padding:12px 18px; border-radius:99px; font-size:13px; font-weight:700;
  opacity:0; pointer-events:none; transition:.25s; z-index:100; max-width:88vw; text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}
[data-theme="dark"] .toast{ background:#EAF0FB; color:#0B1020; }
.toast.show{ opacity:1; transform:translate(-50%,0); }

/* completion */
.donebox{ text-align:center; padding:30px 20px; }
.donebox .big{ font-size:56px; line-height:1; animation:pop .5s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop{ from{ transform:scale(.4); opacity:0 } to{ transform:none; opacity:1 } }
.donebox h2{ margin:16px 0 6px; font-size:22px; letter-spacing:-.4px; }
.donebox p{ margin:0 auto; color:var(--text-2); font-size:13.5px; max-width:300px; line-height:1.6; }
.donebox .stats{ display:flex; justify-content:center; gap:26px; margin:22px 0 8px; }
.donebox .stats div{ font-size:11.5px; color:var(--text-3); font-weight:700; }
.donebox .stats b{ display:block; font-size:24px; color:var(--text); letter-spacing:-.5px; }

/* ---------- 자료 출처 (source) ---------- */
.tag{
  display:inline-block; margin-left:6px; padding:2px 7px; border-radius:var(--r-full);
  font-size:10.5px; font-weight:800; letter-spacing:0; vertical-align:1px;
  border:1px solid transparent;
}
.tag.real{ color:var(--ok); background:var(--ok-soft); border-color:var(--ok-soft); }
.tag.supp{ color:var(--text-3); background:var(--card-3); border-color:var(--line); }
.trackcard .tcsrc{
  margin:10px 0 0; font-size:11px; font-weight:700; opacity:.78;
  padding-top:9px; border-top:1px solid rgba(255,255,255,.18);
}
.srcbox{
  margin-top:14px; padding:12px 14px; border-radius:var(--r-md);
  background:var(--card-2); border:1px dashed var(--line-strong);
}
.srcbox .st{ font-size:11px; font-weight:900; color:var(--text-3); letter-spacing:.3px; margin-bottom:6px; }
.srcbox .sline{ font-size:12.5px; line-height:1.5; color:var(--text); }
.srcbox .sline.dim{ color:var(--text-2); font-size:12px; margin-top:3px; }
.srcbox .slink{
  display:inline-block; margin-top:5px; font-size:12px; font-weight:800;
  color:var(--primary); text-decoration:none; border-bottom:1px solid currentColor;
}
.srcbox .snote{ margin-top:7px; font-size:11.5px; line-height:1.55; color:var(--text-3); }

.srclist{ display:flex; flex-direction:column; gap:10px; }
.srcgroup{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-md);
  padding:13px 15px; box-shadow:var(--shadow-sm);
}
.srcgroup .sgt{ font-size:13px; font-weight:800; margin-bottom:7px; }
.srcgroup .sgr{ padding:6px 0; border-top:1px solid var(--line); }
.srcgroup .sgr:first-of-type{ border-top:0; padding-top:0; }
.srcgroup .sgr a{ font-size:12.5px; font-weight:700; color:var(--primary); text-decoration:none; }
.srcgroup .sgr a:after{ content:" ↗"; font-weight:700; }
.srcgroup .sgn{ font-size:11.5px; line-height:1.55; color:var(--text-3); margin-top:3px; }
.srcgroup .sgn.note{ border-top:1px solid var(--line); padding-top:8px; margin-top:8px; color:var(--text-2); }

</style>
</head>

eaking up도 똑같이 자주 쓰는 표현입니다."],"variations":[{"en":"Sorry, you're breaking up. Can you say that again?","ko":"미안한데 목소리가 끊겨요. 다시 한번 말해줄래요?","note":"breaking up = 통화 품질이 나쁜 상태."},{"en":"I think my connection is unstable. Let me turn off my video.","ko":"연결이 불안정한 것 같아요. 영상 꺼볼게요.","note":"unstable connection = 불안정한 연결."},{"en":"Can you hear me now? I'll try reconnecting.","ko":"지금 제 말 들리세요? 다시 연결해볼게요.","note":"reconnect = 다시 접속하다."}],"roleplay":{"situation":"화상회의 중 거래처 담당자의 목소리가 계속 끊깁니다.","question":"Your client's audio keeps cutting out. What do you say?","questionKo":"거래처 담당자의 소리가 계속 끊길 때 뭐라고 말할까요?","model":"Sorry, your sound keeps cutting in and out. Could you say that one more time? I'll turn my video off to save bandwidth.","modelKo":"죄송해요, 소리가 계속 끊겨요. 한 번만 더 말씀해 주시겠어요? 대역폭을 아끼려고 영상은 꺼둘게요.","tips":["keeps cutting in and out처럼 keeps를 붙이면 반복되는 상황이 돼요.","bandwidth는 인터넷 대역폭, 회사에서는 '업무 여유'라는 뜻으로도 씁니다."]},"source":"스픽 비즈니스 (실무 영어) Day 1","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C"},{"n":2,"title":"앞 회의가 늦어질 때","key":"My meeting is running over.","keyKo":"앞에 회의가 좀 늦어지고 있어요.","nuance":"run over는 정해진 시간을 넘겨 계속되다는 뜻입니다. 진행 중이면 running over로 씁니다.","usage":"다음 일정에 늦을 것 같아 미리 양해를 구할 때 문자나 통화 첫마디로 씁니다.","tips":["I'm running behind도 같은 뜻의 더 캐주얼한 표현이에요.","몇 분 늦을지 숫자로 말하면 상대가 일정을 조정하기 쉬워요."],"variations":[{"en":"Sorry, I'm running a little behind.","ko":"죄송해요, 제가 조금 늦어지고 있어요.","note":"a little behind = 조금 늦는 중."},{"en":"My previous meeting ran over. Can we start 10 minutes late?","ko":"앞 회의가 늦어졌어요. 10분 늦게 시작해도 될까요?","note":"ran over = 이미 늦어진(과거)."},{"en":"I'll be there as soon as this meeting wraps up.","ko":"이 회의 끝나는 대로 갈게요.","note":"wrap up = 마무리하다."}],"roleplay":{"situation":"앞 회의가 길어져 다음 통화에 늦을 것 같습니다.","question":"Apologize for being late to a call and give a time when you'll join.","questionKo":"통화에 늦는 것을 사과하고 언제 들어갈 수 있는지 말해 보세요.","model":"I'm so sorry — my previous meeting is running over. I'll join in about 10 minutes.","modelKo":"정말 죄송합니다. 앞 회의가 늦어지고 있어서요. 10분쯤 뒤에 들어가겠습니다.","tips":["I'll join in about ~ minutes가 가장 자연스러운 예고입니다.","사과는 짧게, 대신 언제 들어가겠다는 정보를 꼭 넣으세요."]},"source":"스픽 비즈니스 (실무 영어) Day 2","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C"},{"n":3,"title":"본론에서 벗어날 때","key":"We are getting a bit sidetracked here.","keyKo":"지금 우리가 본론에서 좀 벗어나고 있어요.","nuance":"sidetracked는 원래 하던 이야기에서 옆길로 새는 것. a bit을 넣으면 지적이 훨씬 부드러워집니다.","usage":"회의가 다른 주제로 흘러갈 때, 진행자로서 자연스럽게 되돌릴 때 씁니다.","tips":["get back on track = 다시 본론으로 돌아가다.","go off on a tangent = 옆길로 새다."],"variations":[{"en":"Let's get back on track.","ko":"다시 본론으로 돌아가죠.","note":"짧고 힘 있는 진행자 표현."},{"en":"That's a good point, but let's come back to it later.","ko":"좋은 지적이에요, 근데 나중에 다시 다뤄요.","note":"상대 의견을 인정하고 미루는 방식."},{"en":"Sorry, I think we're going off on a tangent.","ko":"죄송해요, 우리가 옆길로 새는 것 같아요.","note":"tangent = 본론에서 벗어난 이야기."}],"roleplay":{"situation":"예산 회의가 갑자기 사무실 인테리어 이야기로 흘렀습니다.","question":"Bring the meeting back to the budget topic politely.","questionKo":"회의를 예산 주제로 부드럽게 되돌려 보세요.","model":"Sorry to interrupt — I think we're getting a bit sidetracked. Can we get back to the budget issue?","modelKo":"끼어들어 죄송해요. 우리가 좀 옆길로 새는 것 같아요. 예산 문제로 다시 돌아갈 수 있을까요?","tips":["Sorry to interrupt로 시작하면 끼어드는 부담이 줄어요.","되돌릴 주제를 마지막에 콕 집어 말하세요."]},"source":"스픽 비즈니스 (실무 영어) Day 3","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C"},{"n":4,"title":"이메일 전달·참조","key":"I forwarded the email for your reference.","keyKo":"참고하시라고 이메일을 포워드 해드렸어요.","nuance":"forward는 받은 메일을 그대로 넘기는 것, cc는 참조로 넣는 것. for your reference는 '참고하시라고'라는 뜻입니다.","usage":"거래처와 주고받은 메일을 상사나 관련 팀에 공유할 때 씁니다.","tips":["FYI(for your information)도 같은 역할의 줄임말이에요.","loop someone in = 특정 사람을 대화에 끌어들이다."],"variations":[{"en":"I've cc'd you on the email.","ko":"그 메일에 참조로 넣었습니다.","note":"cc = 참조, bcc = 숨은 참조."},{"en":"I forwarded you the file — please take a look when you get a chance.","ko":"파일 전달드렸어요, 시간 되실 때 봐주세요.","note":"when you get a chance = 시간 될 때."},{"en":"I'm looping in the design team for their reference.","ko":"디자인팀도 참고하라고 참조에 넣을게요.","note":"loop in = 대화에 포함시키다."}],"roleplay":{"situation":"수정된 계약서를 거래처에 보내고, 같은 내용을 팀장님께도 전달했습니다.","question":"Tell your manager that you sent the revised contract to the client and forwarded it to them.","questionKo":"거래처에 수정 계약서를 보냈고 팀장님께도 전달했다고 말해 보세요.","model":"I just sent the revised contract to the client and forwarded it to you for your reference.","modelKo":"방금 거래처에 수정 계약서를 보냈고, 참고하시라고 팀장님께도 전달드렸습니다.","tips":["revised = 수정된, updated도 같은 뜻으로 씁니다.","보낸 대상과 전달한 대상을 순서대로 말하면 명확해요."]},"source":"스픽 비즈니스 (실무 영어) Day 4","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C"},{"n":5,"title":"회의 마무리와 다음 단계","key":"Before we wrap up, what are the next steps?","keyKo":"회의 마무리하기 전에, 다음으로 할 일이 뭐죠?","nuance":"wrap up은 회의·발표를 마무리한다는 뜻. 마무리 직전에 다음 단계를 확인하는 진행자의 정석 표현입니다.","usage":"회의 끝에 누가 무엇을 언제까지 하는지 정리할 때 씁니다.","tips":["action items = 해야 할 일 목록.","Before we wrap up은 마무리 신호라서 참석자들이 긴장을 늦추지 않아요."],"variations":[{"en":"Let's wrap up here.","ko":"여기서 마무리하죠.","note":"회의를 끝내겠다는 신호."},{"en":"Before we wrap up, does anyone have any questions?","ko":"마무리 전에 질문 있으신 분?","note":"질문 시간을 확보하는 표현."},{"en":"Can we quickly go over the action items?","ko":"액션 아이템만 빠르게 짚어볼까요?","note":"go over = 하나씩 확인하다."}],"roleplay":{"situation":"주간 팀 회의를 마무리하면서 담당자와 마감일을 정해야 합니다.","question":"Wrap up the meeting and confirm who does what by when.","questionKo":"회의를 마무리하고 누가 무엇을 언제까지 할지 확인해 보세요.","model":"Before we wrap up, let's confirm the next steps. Jina, can you send the pricing sheet by Thursday?","modelKo":"마무리하기 전에 다음 단계를 확인하죠. 지나 님, 목요일까지 가격표를 보내주실 수 있나요?","tips":["이름 + 할 일 + 마감일 순서로 말하면 액션이 명확해져요.","let's confirm으로 시작하면 지시가 아니라 합의처럼 들립니다."]},"source":"스픽 비즈니스 (실무 영어) Day 5","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C","driveSource":"내 드라이브 '스픽 스크립트'에 같은 문장 수록"},{"n":6,"title":"복습 · 효율적인 회의","review":true,"key":"We should schedule a 1-on-1 meeting.","keyKo":"면담 일정을 잡는 게 좋겠어요.","nuance":"이번 주 회의 표현을 한 번에 정리합니다. 일정 잡기 → 음성 문제 → 늦어짐 → 본론 복귀 → 마무리 순서로 이어 말해 보세요.","usage":"회의를 여는 순간부터 닫는 순간까지 한 흐름으로 연습하면 실제 회의에서 입이 먼저 나갑니다.","tips":["각 문장을 3초 안에 말할 수 있으면 실전에서 쓸 수 있는 수준이에요.","모르는 문장은 다시 Day 0~5로 돌아가 들어보세요."],"variations":[{"en":"Sorry, your sound is cutting in and out.","ko":"죄송한데 소리가 끊겨요.","note":"Day 1 · 음성 문제."},{"en":"My meeting is running over — can we start 10 minutes late?","ko":"회의가 늦어지고 있어요. 10분 늦게 시작해도 될까요?","note":"Day 2 · 지연 양해."},{"en":"I think we're getting a bit sidetracked. Let's get back on track.","ko":"우리가 좀 옆길로 새는 것 같아요. 본론으로 돌아가죠.","note":"Day 3 · 진행 관리."},{"en":"Before we wrap up, what are the next steps?","ko":"마무리 전에 다음 단계가 뭐죠?","note":"Day 5 · 마무리."}],"roleplay":{"situation":"회의 시간이 다 됐는데 논의가 길어졌습니다. 마무리하고 다음 단계를 정해야 합니다.","question":"You're leading a weekly call that is running long. Wrap it up and assign next steps.","questionKo":"길어지고 있는 주간 회의를 마무리하고 다음 단계를 정해 보세요.","model":"We're almost out of time, so let's wrap up here. Jina, can you send the notes by tomorrow?","modelKo":"시간이 거의 다 됐으니 여기서 마무리하죠. 지나 님, 내일까지 회의록 보내주실 수 있나요?","tips":["We're almost out of time으로 마무리 이유를 먼저 말하면 자연스러워요.","마무리 멘트 뒤에는 반드시 액션 한두 개를 붙이세요."]},"source":"스픽 비즈니스 (실무 영어) Day 6 (복습일)","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C"},{"n":7,"title":"발표 도입부 — 목적 말하기","key":"The goal of this presentation is to outline our marketing strategy.","keyKo":"발표의 취지는 마케팅 전략을 간략하게 설명해 드리는 겁니다.","nuance":"goal 대신 purpose를 써도 됩니다. outline은 세부보다 큰 틀을 설명한다는 뉘앙스예요.","usage":"발표 첫 10초에 오늘 무엇을 들을지 알려주면 청중의 집중도가 확 올라갑니다.","tips":["I'll cover three things: A, B, and C로 목차를 예고하면 좋아요.","walk you through = 하나하나 설명해 주다."],"variations":[{"en":"Today I'm going to walk you through our Q2 results.","ko":"오늘은 2분기 실적을 설명드리겠습니다.","note":"walk through = 차근차근 설명하다."},{"en":"The purpose of today's meeting is to align on next year's budget.","ko":"오늘 회의 목적은 내년 예산에 대한 의견을 맞추는 것입니다.","note":"align on = 의견을 맞추다."},{"en":"I'll cover three things: the market, our results, and the plan.","ko":"시장, 실적, 계획 세 가지를 다루겠습니다.","note":"cover = 다루다."}],"roleplay":{"situation":"신제품 로드맵 발표를 시작합니다. 첫 문장으로 발표 목적을 말해야 합니다.","question":"Open your presentation by stating its goal.","questionKo":"발표 목적을 밝히며 발표를 시작해 보세요.","model":"Good morning, everyone. The goal of today's presentation is to outline our product roadmap for next year.","modelKo":"좋은 아침입니다. 오늘 발표의 목적은 내년 제품 로드맵을 개괄적으로 설명드리는 것입니다.","tips":["Good morning, everyone.으로 시작하면 발표자 자리가 잡혀요.","목적 한 문장 뒤에는 목차 한 문장을 붙이면 완성도가 올라갑니다."]},"source":"스픽 비즈니스 (실무 영어) Day 7","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C"},{"n":8,"title":"전사 협조 요청","key":"To that end, we need all hands on deck.","keyKo":"목표 달성을 위해서, 전사적인 노력이 필요합니다.","nuance":"to that end는 방금 말한 목표를 이루기 위해. all hands on deck은 배에서 온 표현으로 '전원 총동원'을 뜻합니다.","usage":"목표를 말한 뒤, 팀 전체의 협조가 필요하다고 강조할 때 씁니다.","tips":["pitch in = 힘을 보태다.","get involved = 참여하다."],"variations":[{"en":"With that in mind, let's take a look at the numbers.","ko":"그런 점을 염두에 두고 숫자를 보시죠.","note":"with that in mind = 그걸 고려해서."},{"en":"That means everyone needs to pitch in.","ko":"그 말은 모두가 힘을 보태야 한다는 뜻이에요.","note":"pitch in = 함께 돕다."},{"en":"We'll need the whole team to get involved.","ko":"팀 전체가 참여해야 합니다.","note":"get involved = 관여하다."}],"roleplay":{"situation":"납기를 맞추려면 전 팀의 도움이 필요합니다. 팀장들에게 협조를 요청하세요.","question":"Explain that hitting the deadline requires the whole team's help.","questionKo":"납기를 맞추려면 팀 전체의 도움이 필요하다고 설명해 보세요.","model":"To hit the deadline, we need all hands on deck — even a few hours a week from each team will help.","modelKo":"납기를 맞추려면 전원이 힘을 모아야 합니다. 각 팀에서 주당 몇 시간만 도와주셔도 큰 힘이 됩니다.","tips":["To hit the deadline처럼 목적을 앞에 두면 요청이 논리적으로 들려요.","even a few hours처럼 부담을 낮춰 말하면 수락률이 높아집니다."]},"source":"스픽 비즈니스 (실무 영어) Day 8","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C"},{"n":9,"title":"수치로 성과 강조하기","key":"We could see as much as a 20% increase in productivity.","keyKo":"무려 20%의 생산성 증가를 기대할 수 있습니다.","nuance":"as much as ~는 '무려 ~까지'라는 강조. could see는 '기대할 수 있다'는 전망 표현입니다.","usage":"예상 효과를 수치로 제시해 설득력을 높일 때 씁니다.","tips":["up to ~ = 최대 ~까지.","roughly / approximately = 대략."],"variations":[{"en":"Sales are expected to grow by up to 15% next quarter.","ko":"다음 분기 매출은 최대 15% 성장이 예상됩니다.","note":"be expected to = ~할 것으로 예상되다."},{"en":"We're looking at roughly a 5% drop in costs.","ko":"비용은 대략 5% 감소할 것으로 봅니다.","note":"we're looking at = ~을 예상하고 있다."},{"en":"That's nearly double what we saw last year.","ko":"작년의 거의 두 배입니다.","note":"double = 두 배."}],"roleplay":{"situation":"내년 매출이 최대 10% 늘어날 수 있다는 전망을 발표합니다.","question":"Present a forecast: revenue may rise by up to 10%.","questionKo":"매출이 최대 10% 오를 수 있다는 전망을 말해 보세요.","model":"Based on this forecast, we could see as much as a 10% increase in revenue next year.","modelKo":"이 전망에 따르면 내년 매출은 최대 10%까지 늘어날 수 있습니다.","tips":["Based on ~으로 근거를 먼저 말하면 숫자가 믿음직하게 들려요.","increase in revenue / growth in sales처럼 명사로 받아주세요."]},"source":"스픽 비즈니스 (실무 영어) Day 9","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C"},{"n":10,"title":"데이터로 설명하기","key":"As you can see from this data, there's a slight bump in numbers.","keyKo":"데이터에서 보시다시피, 수치가 약간 상승했습니다.","nuance":"bump는 작은 상승, dip은 작은 하락. slight를 붙여 변화가 크지 않음을 강조합니다.","usage":"차트를 띄우고 변화의 방향과 크기를 한 문장으로 설명할 때 씁니다.","tips":["As you can see from this chart/data = 화면을 보며 설명하는 정석.","flat = 변화 없이 평평한."],"variations":[{"en":"There's a slight dip in revenue this month.","ko":"이번 달 매출이 소폭 하락했습니다.","note":"dip = 소폭 하락."},{"en":"As you can see from this chart, sales have been flat.","ko":"차트에서 보시다시피 매출은 정체 상태입니다.","note":"flat = 평평한, 변화 없음."},{"en":"The numbers have been climbing steadily since March.","ko":"3월부터 수치가 꾸준히 오르고 있습니다.","note":"climb steadily = 꾸준히 상승."}],"roleplay":{"situation":"10월 매출이 9월보다 약 3% 올랐다는 차트를 보여줍니다.","question":"Show a chart where sales rose slightly in October.","questionKo":"10월 매출이 소폭 상승한 차트를 설명해 보세요.","model":"As you can see from this data, there's a slight bump in October — about 3% compared to September.","modelKo":"이 데이터에서 보시다시피 10월에 소폭 상승이 있었습니다. 9월 대비 약 3%입니다.","tips":["compared to ~로 비교 대상을 붙이면 숫자가 해석됩니다.","about / around으로 어림값임을 표시하세요."]},"source":"스픽 비즈니스 (실무 영어) Day 10","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C"},{"n":11,"title":"다음 주제로 전환","key":"Now, let's move on to the next topic.","keyKo":"이제 다음 주제로 넘어가겠습니다.","nuance":"move on to ~는 발표에서 다음 주제로 넘어가는 신호입니다. Now를 붙이면 전환 지점이 분명해져요.","usage":"한 주제를 끝내고 다음 섹션으로 넘어갈 때 씁니다.","tips":["That brings me to my next point도 같은 역할.","I'll come back to that later = 그건 나중에 다시 다루겠습니다."],"variations":[{"en":"That brings me to my next point.","ko":"그러면 다음 포인트로 넘어가겠습니다.","note":"자연스러운 연결 표현."},{"en":"Let's turn to the budget.","ko":"예산으로 넘어가죠.","note":"turn to = 화제를 돌리다."},{"en":"I'll come back to that in a moment.","ko":"그건 잠시 후에 다시 말씀드리겠습니다.","note":"질문을 받았을 때 유용."}],"roleplay":{"situation":"매출 실적 설명을 마치고 마케팅 계획으로 넘어갑니다.","question":"Move from the sales results to the marketing plan.","questionKo":"매출 실적에서 마케팅 계획으로 화제를 전환해 보세요.","model":"Now, let's move on to the next topic: our marketing plan for Q1.","modelKo":"이제 다음 주제인 1분기 마케팅 계획으로 넘어가겠습니다.","tips":["주제를 콜론으로 바로 붙이면 듣는 사람이 따라오기 쉬워요.","전환 후 첫 문장은 반드시 짧게."]},"source":"스픽 비즈니스 (실무 영어) Day 11","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C"},{"n":12,"title":"복습 · 깊은 인상을 남기는 발표","review":true,"key":"Now, let's move on to the next topic.","keyKo":"이제 다음 주제로 넘어가겠습니다.","nuance":"발표의 뼈대는 목적 → 근거 → 전환 → 마무리입니다. 순서를 기억하면 내용이 바뀌어도 말할 수 있어요.","usage":"발표 전체를 1분으로 압축해서 말해 보세요.","tips":["목적·수치·전환·마무리를 각각 한 문장으로 말해 보세요.","막히면 Day 7~11로 돌아가 반복하세요."],"variations":[{"en":"The goal of this presentation is to outline our marketing strategy.","ko":"발표의 취지는 마케팅 전략을 설명하는 것입니다.","note":"Day 7 · 목적."},{"en":"We could see as much as a 20% increase in productivity.","ko":"무려 20%의 생산성 증가를 기대할 수 있습니다.","note":"Day 9 · 수치."},{"en":"As you can see from this data, there's a slight bump in numbers.","ko":"데이터에서 보시다시피 수치가 약간 올랐습니다.","note":"Day 10 · 근거."},{"en":"That concludes my presentation.","ko":"이상으로 발표를 마치겠습니다.","note":"마무리 표현."}],"roleplay":{"situation":"발표를 마치고 질문을 받을 차례입니다.","question":"Close your presentation and invite questions.","questionKo":"발표를 마무리하고 질문을 청해 보세요.","model":"That concludes my presentation. Thanks for listening — any thoughts, comments, or feedback?","modelKo":"이상으로 발표를 마치겠습니다. 들어주셔서 감사합니다. 의견이나 피드백 있으신가요?","tips":["That concludes my presentation은 가장 격식 있는 마무리입니다.","질문을 청할 때 침묵이 생기면 특정인에게 눈을 맞추세요."]},"source":"스픽 비즈니스 (실무 영어) Day 12 (복습일)","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C"},{"n":13,"title":"상대 의도 확인하기","key":"So, are you saying that you'd like to delay the decision?","keyKo":"결정을 보류하자는 말씀이신 거죠?","nuance":"are you saying that ~?은 상대 말을 내 언어로 정리해 확인하는 질문. 오해를 막는 가장 강력한 도구입니다.","usage":"협상 중 상대 요구가 애매할 때, 결정 전에 반드시 확인해야 할 때 씁니다.","tips":["Just to make sure I understand로 시작하면 더 부드러워요.","So your point is that ~도 같은 기능."],"variations":[{"en":"Just to make sure I understand — you want to push the launch to March?","ko":"제가 제대로 이해한 건지 확인차, 출시를 3월로 미루자는 말씀이시죠?","note":"push the launch = 출시를 미루다."},{"en":"So your point is that the budget is too small.","ko":"그러니까 예산이 너무 적다는 말씀이시군요.","note":"So your point is that ~ 정리 확인."},{"en":"Are you suggesting we wait another quarter?","ko":"한 분기 더 기다리자는 제안이신가요?","note":"suggest = 제안하다."}],"roleplay":{"situation":"거래처가 일정이 촉박하다고만 말하고 결정은 미루려 합니다.","question":"A client says the timeline feels rushed. Confirm what they mean before you respond.","questionKo":"거래처가 일정이 촉박하다고 합니다. 답하기 전에 의도를 확인해 보세요.","model":"So, are you saying that you'd like to delay the decision until you've seen the updated numbers?","modelKo":"그러니까 업데이트된 수치를 보실 때까지 결정을 미루고 싶다는 말씀이신가요?","tips":["상대 말을 되짚으면 감정적 대응을 피할 수 있어요.","확인 질문 뒤에는 반드시 대안을 준비하세요."]},"source":"스픽 비즈니스 (실무 영어) Day 13","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C"},{"n":14,"title":"완곡하게 반대하기","key":"Don't you think the deadline is too tight?","keyKo":"마감이 너무 빠듯하다고 생각하지 않으세요?","nuance":"부정 의문문은 단정적인 반대를 부드럽게 만듭니다. tight는 시간·예산이 빠듯하다는 뜻이에요.","usage":"상사의 제안에 정면 반박 대신 의문형으로 우려를 전달할 때 씁니다.","tips":["With all due respect는 격식 있는 반대의 시작.","realistic = 현실적인."],"variations":[{"en":"I'm not sure that timeline is realistic.","ko":"그 일정이 현실적이라고 생각하지 않아요.","note":"I'm not sure ~ 로 완곡하게."},{"en":"Isn't that a bit too aggressive?","ko":"그건 좀 무리 아닐까요?","note":"aggressive = (일정이) 빡빡한."},{"en":"With all due respect, I think we need more time.","ko":"외람되지만 시간이 더 필요할 것 같습니다.","note":"격식 있는 반대 표현."}],"roleplay":{"situation":"상사가 2주 안에 끝내자고 합니다. 무리라고 생각됩니다.","question":"Disagree with a two-week deadline politely.","questionKo":"2주 마감이 무리라고 정중하게 반대해 보세요.","model":"Don't you think the deadline is too tight? Two weeks may not be enough to test everything properly.","modelKo":"마감이 너무 빠듯하지 않으세요? 2주로는 모든 걸 제대로 테스트하기 어려울 것 같습니다.","tips":["이유를 숫자나 절차로 붙이면 반대가 설득력 있어져요.","may not be enough는 단정 대신 가능성으로 말합니다."]},"source":"스픽 비즈니스 (실무 영어) Day 14","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C"},{"n":15,"title":"대안 제안하기","key":"What if we run a promotion?","keyKo":"프로모션을 진행해 보면 어때요?","nuance":"What if we ~?는 회의에서 가장 자주 쓰는 제안 표현. 상대를 몰아붙이지 않고 선택지를 던집니다.","usage":"문제를 지적만 하지 않고 해결책을 꺼낼 때 씁니다.","tips":["How about we ~?도 같은 뜻으로 더 캐주얼해요.","run a promotion = 프로모션을 진행하다."],"variations":[{"en":"What if we split the cost 50/50?","ko":"비용을 반반 나누면 어때요?","note":"split = 나누다."},{"en":"How about we test it with one store first?","ko":"한 매장에서 먼저 테스트해보는 건 어때요?","note":"How about we ~? 캐주얼 제안."},{"en":"What if we push the launch back a week?","ko":"출시를 일주일 미루면 어때요?","note":"push back = 미루다."}],"roleplay":{"situation":"재고가 쌓였습니다. 새 모델 출시 전에 처리할 방법을 제안하세요.","question":"Propose a short discount period to clear slow-selling inventory.","questionKo":"재고를 털어낼 짧은 할인 기간을 제안해 보세요.","model":"What if we run a two-week promotion? It could help clear the inventory before the new model arrives.","modelKo":"2주짜리 프로모션을 진행하면 어때요? 새 모델이 들어오기 전에 재고를 정리하는 데 도움이 될 거예요.","tips":["제안 + 기대 효과를 한 세트로 말하면 채택률이 올라가요.","It could help ~ = ~에 도움이 될 수 있다."]},"source":"스픽 비즈니스 (실무 영어) Day 15","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C"},{"n":16,"title":"반대 의견 뒤에 가능성 말하기","key":"But I think it's still doable.","keyKo":"해볼 만하다고 생각해요.","nuance":"doable은 '해낼 수 있는'. 상대의 우려를 인정한 뒤 긍정으로 방향을 트는 표현입니다.","usage":"팀이 불가능하다고 할 때, 조건을 붙여 가능하다고 설득할 때 씁니다.","tips":["It's tight, but ~ = 빠듯하지만 ~.","pull it off = 해내다."],"variations":[{"en":"I think we can make it work.","ko":"해낼 수 있다고 봐요.","note":"make it work = 어떻게든 되게 하다."},{"en":"It's tight, but it's not impossible.","ko":"빠듯하지만 불가능한 건 아니에요.","note":"tight = 빠듯한."},{"en":"Let's see if we can pull it off.","ko":"해낼 수 있을지 한번 해보죠.","note":"pull it off = 성공시키다."}],"roleplay":{"situation":"팀은 일정이 불가능하다고 하지만, 인력만 보강하면 가능하다고 봅니다.","question":"Your team says the schedule is impossible. Explain why you think it can still work.","questionKo":"팀은 불가능하다고 하지만, 보강하면 가능하다고 설명해 보세요.","model":"I know it's tight, but I think it's still doable if we bring in two more people.","modelKo":"빠듯한 건 알지만, 두 명만 더 투입하면 여전히 해볼 만하다고 생각해요.","tips":["I know it's tight로 상대 우려를 먼저 인정하세요.","if we ~ 조건을 붙이면 '무리한 요구'가 아니라 '계획'이 됩니다."]},"source":"스픽 비즈니스 (실무 영어) Day 16","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C"},{"n":17,"title":"복습 · 반대 의견 다루기","review":true,"key":"Don't you think the deadline is too tight?","keyKo":"마감이 너무 빠듯하다고 생각하지 않으세요?","nuance":"확인 → 완곡한 반대 → 대안 → 조건부 수용의 4단계로 이어 말해 보세요. 회의 갈등의 대부분은 이 흐름으로 풀립니다.","usage":"상대와 의견이 다를 때 감정 없이 논리로 말하는 연습입니다.","tips":["반대만 하고 끝내면 안 되고, 반드시 대안을 붙이세요.","Day 13~16을 오가며 네 문장을 이어 말해 보세요."],"variations":[{"en":"So, are you saying that you'd like to delay the decision?","ko":"결정을 보류하자는 말씀이신가요?","note":"Day 13 · 확인."},{"en":"What if we run a promotion?","ko":"프로모션을 진행해 보면 어때요?","note":"Day 15 · 대안."},{"en":"But I think it's still doable.","ko":"그래도 해볼 만하다고 생각해요.","note":"Day 16 · 가능성."},{"en":"With all due respect, I think we need more time.","ko":"외람되지만 시간이 더 필요할 것 같습니다.","note":"Day 14 · 반대."}],"roleplay":{"situation":"동료가 출시 연기를 주장합니다. 일부 동의하지만 절충안을 내고 싶습니다.","question":"A coworker wants to delay the launch. Agree partly, then propose a compromise.","questionKo":"동료의 연기 주장에 일부 동의하고 절충안을 제안해 보세요.","model":"I see your point, and I agree the deadline is tight. What if we delay only the launch event and keep the product date?","modelKo":"무슨 말씀인지 알겠고, 마감이 빠듯한 것도 동의해요. 출시 행사만 미루고 제품 출시일은 지키면 어떨까요?","tips":["I see your point로 시작하면 협력적으로 들립니다.","only를 넣어 양보 범위를 좁히세요."]},"source":"스픽 비즈니스 (실무 영어) Day 17 (복습일)","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C"},{"n":18,"title":"핵심 성과 강조하기","key":"I'd like to highlight that customer satisfaction levels are at an all-time high.","keyKo":"고객 만족도가 역대 최고라는 걸 특별히 강조하고 싶습니다.","nuance":"highlight / emphasize는 '강조하다'. all-time high는 '역대 최고'로 최상급 강조 표현입니다.","usage":"보고에서 좋은 소식을 청중 기억에 남기고 싶을 때 씁니다.","tips":["It's worth noting that ~ = ~라는 점도 짚을 만합니다.","key takeaway = 핵심 요점."],"variations":[{"en":"I'd like to emphasize that we beat our Q1 target.","ko":"1분기 목표를 넘었다는 점을 강조하고 싶습니다.","note":"beat a target = 목표를 넘다."},{"en":"It's worth noting that complaints have dropped by half.","ko":"불만이 절반으로 줄었다는 점도 짚고 싶습니다.","note":"drop by half = 절반으로 줄다."},{"en":"The key takeaway is that customers trust us more.","ko":"핵심은 고객의 신뢰가 높아졌다는 겁니다.","note":"takeaway = 핵심 요점."}],"roleplay":{"situation":"고객 만족도가 87%에서 94%로 올랐습니다. 보고에서 이 점을 강조하세요.","question":"Emphasize record customer satisfaction in your report.","questionKo":"역대 최고 고객 만족도를 보고에서 강조해 보세요.","model":"I'd like to highlight that customer satisfaction is at an all-time high — 94%, up from 87% last year.","modelKo":"고객 만족도가 역대 최고라는 점을 강조하고 싶습니다. 작년 87%에서 94%로 올랐습니다.","tips":["숫자를 두 개 붙이면 변화가 한눈에 보여요.","up from ~ = ~에서 올라서."]},"source":"스픽 비즈니스 (실무 영어) Day 18","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C","driveSource":"내 드라이브 '스픽 스크립트'에 같은 문장 수록"},{"n":19,"title":"본질로 돌아가기","key":"At the end of the day, we just need more time.","keyKo":"결국엔 시간이 더 많이 필요해요.","nuance":"at the end of the day는 '결국, 궁극적으로'. 긴 논의를 한 문장으로 정리할 때 씁니다.","usage":"논의가 길어지고 핵심이 흐려질 때 본질을 다시 꺼낼 때 씁니다.","tips":["when it comes down to it도 같은 뜻.","ultimately = 궁극적으로."],"variations":[{"en":"At the end of the day, it's about trust.","ko":"결국 중요한 건 신뢰예요.","note":"it's about ~ = 핵심은 ~이다."},{"en":"When it comes down to it, we can't do it alone.","ko":"결국 우리 힘만으로는 안 됩니다.","note":"when it comes down to it = 결국 따져보면."},{"en":"Ultimately, we need more funding.","ko":"궁극적으로 자금이 더 필요합니다.","note":"ultimately = 결국."}],"roleplay":{"situation":"회의에서 여러 문제가 나왔지만 결국 사람이 부족합니다.","question":"Summarize the core problem in one sentence.","questionKo":"핵심 문제를 한 문장으로 정리해 보세요.","model":"At the end of the day, we just need more people — the process is fine, but we're understaffed.","modelKo":"결국 사람이 더 필요합니다. 프로세스는 괜찮은데 인력이 부족해요.","tips":["문제 → 이유 순서로 한 문장에 담으세요.","understaffed = 인력이 부족한."]},"source":"스픽 비즈니스 (실무 영어) Day 19","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C","driveSource":"내 드라이브 '스픽 스크립트'에 같은 문장 수록"},{"n":20,"title":"상황을 감안해 판단 묻기","key":"Given the circumstances, does it make sense to hire a contractor?","keyKo":"상황을 감안했을 때, 계약직을 고용하는 것이 합리적인가요?","nuance":"Given ~ = ~을 감안하면. does it make sense to ~?는 판단을 함께 묻는 표현이라 독단적으로 보이지 않습니다.","usage":"예산·일정 등 제약이 있을 때 선택지의 타당성을 함께 검토할 때 씁니다.","tips":["outsource = 외주를 주다.","Given the budget / Given the timeline처럼 조건을 바꿔 연습하세요."],"variations":[{"en":"Given the budget, is it worth renting a smaller office?","ko":"예산을 감안하면 더 작은 사무실을 빌리는 게 나을까요?","note":"is it worth ~ing = ~할 가치가 있나."},{"en":"Does it make sense to outsource production?","ko":"생산을 외주로 돌리는 게 합리적일까요?","note":"outsource = 외주화하다."},{"en":"Considering the timeline, maybe we should skip the pilot.","ko":"일정을 고려하면 파일럿은 건너뛰는 게 나을지도요.","note":"considering = ~을 고려하면."}],"roleplay":{"situation":"업무량이 급증했습니다. 3개월 계약직 채용이 합리적인지 상사에게 묻습니다.","question":"Ask whether hiring a freelancer is sensible given the workload.","questionKo":"업무량을 감안해 프리랜서 채용이 합리적인지 물어보세요.","model":"Given the circumstances, does it make sense to hire a freelancer for three months?","modelKo":"상황을 감안하면 3개월 프리랜서를 쓰는 게 합리적일까요?","tips":["기간(three months)을 붙이면 비용 검토가 쉬워져요.","질문형으로 물으면 상사의 결정 부담이 줄어듭니다."]},"source":"스픽 비즈니스 (실무 영어) Day 20","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C","driveSource":"내 드라이브 '스픽 스크립트'에 같은 문장 수록"},{"n":21,"title":"절충안 제시하기","key":"What if we meet halfway by looking for other vendors?","keyKo":"다른 업체를 찾는 선에서 절충하는 게 어때요?","nuance":"meet halfway는 '중간에서 만나다', 즉 절충. by ~ing는 절충의 방법을 붙입니다.","usage":"가격·일정 협상에서 양보와 요구를 동시에 제시할 때 씁니다.","tips":["split the difference = 차액을 반씩 나누다.","compromise on ~ = ~에서 타협하다."],"variations":[{"en":"What if we split the difference?","ko":"차액을 반씩 나누면 어때요?","note":"split the difference = 중간값으로 합의."},{"en":"Can we compromise on the price?","ko":"가격에서 절충할 수 있을까요?","note":"compromise on = ~에서 타협."},{"en":"What if we meet halfway by cutting the scope?","ko":"범위를 줄이는 선에서 절충하면 어때요?","note":"scope = 업무 범위."}],"roleplay":{"situation":"공급업체가 가격을 5% 올리겠다고 합니다. 절충안을 제시하세요.","question":"The supplier wants a 5% price increase. Propose a middle ground.","questionKo":"공급업체가 5% 인상을 요구합니다. 절충안을 제안해 보세요.","model":"What if we meet halfway? We can accept a 3% increase, and you keep the delivery date.","modelKo":"절충하면 어떨까요? 3% 인상은 받아들이는 대신 납기일은 지켜주세요.","tips":["양보 + 조건을 한 문장에 담으면 협상이 빨라져요.","we can accept ~ 로 수용 범위를 명확히 하세요."]},"source":"스픽 비즈니스 (실무 영어) Day 21","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C"},{"n":22,"title":"마무리 작업 말하기","key":"We need to put the finishing touches on the project.","keyKo":"프로젝트의 마무리 작업을 해야 해요.","nuance":"put the finishing touches on ~은 '~에 마지막 손질을 하다'. 거의 다 됐고 조금만 더 다듬으면 된다는 뉘앙스입니다.","usage":"완성 직전 상태를 보고할 때, 마감이 임박했음을 알릴 때 씁니다.","tips":["iron out the details = 세부 사항을 정리하다.","finalize = 확정하다."],"variations":[{"en":"I need to put the finishing touches on the presentation.","ko":"발표 자료 마무리 손질을 해야 해요.","note":"자료 마무리에 자주 쓰는 문장."},{"en":"Let's iron out the details of the contract.","ko":"계약서 세부 사항을 정리합시다.","note":"iron out = 문제를 풀어 정리하다."},{"en":"If we can, let's finalize the details before the day ends.","ko":"가능하면 오늘 안으로 세부 사항을 확정합시다.","note":"finalize = 최종 확정하다."}],"roleplay":{"situation":"발표 자료가 거의 완성됐습니다. 마지막 슬라이드만 다듬으면 됩니다.","question":"Tell the team the deck just needs final polish before you send it.","questionKo":"자료를 보내기 전 마지막 손질만 하면 된다고 팀에 알려 보세요.","model":"The deck is almost ready — I just need to put the finishing touches on the last few slides.","modelKo":"자료는 거의 준비됐고, 마지막 몇 장만 손보면 됩니다.","tips":["almost ready + just need로 상태를 정확히 전달하세요.","deck = 발표 자료(슬라이드 묶음)."]},"source":"스픽 비즈니스 (실무 영어) Day 22","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C","driveSource":"내 드라이브 '스픽 스크립트'에 같은 문장 수록"},{"n":23,"title":"복습 · 업무 협의","review":true,"key":"Given the circumstances, does it make sense to hire a contractor?","keyKo":"상황을 감안했을 때, 계약직을 고용하는 것이 합리적인가요?","nuance":"협의의 흐름은 강조 → 결론 → 판단 질문 → 절충 → 마무리입니다. 상대와 숫자가 오갈 때 이 순서가 특히 유용해요.","usage":"가격·인력·일정 협의를 한 흐름으로 연습합니다.","tips":["Day 18~22를 이어서 말해 보세요.","절충안에는 반드시 조건을 붙이세요."],"variations":[{"en":"At the end of the day, we just need more time.","ko":"결국 시간이 더 필요합니다.","note":"Day 19 · 본질."},{"en":"What if we meet halfway by looking for other vendors?","ko":"다른 업체를 찾는 선에서 절충하면 어때요?","note":"Day 21 · 절충."},{"en":"We need to put the finishing touches on the project.","ko":"프로젝트 마무리 작업을 해야 합니다.","note":"Day 22 · 마무리."},{"en":"I'd like to highlight that customer satisfaction levels are at an all-time high.","ko":"고객 만족도가 역대 최고임을 강조하고 싶습니다.","note":"Day 18 · 강조."}],"roleplay":{"situation":"공급업체가 원자재 가격 상승으로 인상을 요구합니다. 인정하고 절충안을 제시하세요.","question":"Negotiate with a vendor who raised prices: acknowledge, then propose a compromise.","questionKo":"가격을 올린 업체와 협상해 보세요. 인정한 뒤 절충안을 제시하세요.","model":"I understand costs have gone up. What if we meet halfway — a 3% increase now, and we revisit in six months?","modelKo":"비용이 오른 건 이해합니다. 절충하면 어떨까요? 지금은 3% 인상하고, 6개월 뒤에 다시 논의하는 거죠.","tips":["감정 없이 사실을 인정하는 첫 문장이 협상의 판을 만듭니다.","revisit = 다시 논의하다."]},"source":"스픽 비즈니스 (실무 영어) Day 23 (복습일)","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C","driveSource":"내 드라이브 '스픽 스크립트'에 같은 문장 수록"},{"n":24,"title":"이메일 후속 확인","key":"I just wanted to follow up on my email.","keyKo":"다름 아니라, 제가 보내드린 이메일에 대해 추가로 확인하고 싶습니다.","nuance":"follow up on ~은 '~에 대해 후속 확인하다'. just wanted to ~는 요청을 가볍게 만드는 완충 장치입니다.","usage":"답장이 없을 때 재촉하지 않고 정중하게 확인할 때 씁니다.","tips":["Have you had a chance to ~? = ~해 보실 기회 있었나요?","checking in = 확인차 연락드려요."],"variations":[{"en":"I just wanted to follow up on our conversation from yesterday.","ko":"어제 나눈 대화에 대해 다시 확인하고 싶었어요.","note":"conversation from yesterday = 어제 대화."},{"en":"Have you had a chance to look at the proposal?","ko":"제안서 검토해 보실 기회가 있었나요?","note":"재촉 없이 확인하는 표현."},{"en":"Just checking in on the contract.","ko":"계약서 관련해 확인차 연락드려요.","note":"check in = 상황 확인차 연락하다."}],"roleplay":{"situation":"3일 전에 견적서를 메일로 보냈는데 답이 없습니다. 정중히 확인하세요.","question":"You emailed a quote three days ago. Ask politely for feedback.","questionKo":"3일 전 보낸 견적서에 대해 정중히 피드백을 요청해 보세요.","model":"Hi, I just wanted to follow up on my email from Monday. Have you had a chance to review the quote?","modelKo":"안녕하세요, 월요일에 보낸 메일에 대해 확인차 연락드렸습니다. 견적서 검토해 보실 기회가 있었나요?","tips":["언제 보냈는지 밝히면 상대가 바로 찾을 수 있어요.","질문으로 끝내면 재촉이 아니라 확인이 됩니다."]},"source":"스픽 비즈니스 (실무 영어) Day 24","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C"},{"n":25,"title":"문제 조사 약속하기","key":"I'll take a deeper look into the issue.","keyKo":"문제를 좀 더 자세히 알아볼게요.","nuance":"look into는 '조사하다'. deeper를 붙이면 표면적 답변이 아니라 원인까지 보겠다는 뜻이 됩니다.","usage":"고객 불만이나 내부 오류를 접수하고 후속 조치를 약속할 때 씁니다.","tips":["get back to you = 다시 연락드리다.","identify root causes = 근본 원인을 찾다."],"variations":[{"en":"I'll look into the issue and get back to you.","ko":"문제를 살펴보고 다시 연락드릴게요.","note":"가장 기본적인 후속 조치 표현."},{"en":"I'll investigate the complaint right away.","ko":"불만 사항을 바로 조사하겠습니다.","note":"right away = 즉시."},{"en":"I'll get back to you once I have more details.","ko":"자세한 내용 파악되면 연락드리겠습니다.","note":"once ~ = ~하면."}],"roleplay":{"situation":"고객이 선적이 누락됐다고 항의합니다. 조사하고 언제 답을 주겠다고 약속하세요.","question":"A customer reports a missing shipment. Promise to investigate and say when you'll respond.","questionKo":"선적 누락 항의에 조사하겠다고 답하고 언제 연락할지 약속해 보세요.","model":"I'm sorry about that. I'll take a deeper look into the shipment and get back to you by tomorrow.","modelKo":"불편을 드려 죄송합니다. 선적 건을 자세히 확인해서 내일까지 연락드리겠습니다.","tips":["사과 → 조치 → 기한 순서가 신뢰를 만듭니다.","by tomorrow = 내일까지(기한)."]},"source":"스픽 비즈니스 (실무 영어) Day 25","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C","driveSource":"내 드라이브 '스픽 스크립트'에 같은 문장 수록"},{"n":26,"title":"의견 묻기","key":"What are your thoughts on the survey results?","keyKo":"설문 결과에 대해 어떻게 생각하세요?","nuance":"thoughts on ~은 격식 있는 '의견'. What's your take on it?은 같은 뜻의 캐주얼한 버전입니다.","usage":"회의에서 특정 사람의 의견을 끌어낼 때, 침묵을 깰 때 씁니다.","tips":["Any thoughts, comments, or feedback? = 의견 있으신가요?","How do you feel about ~? = ~에 대해 어떻게 생각하세요?"],"variations":[{"en":"What's your take on the new design?","ko":"새 디자인에 대한 의견은 어때요?","note":"take = 의견(캐주얼)."},{"en":"Any thoughts, comments, or feedback?","ko":"의견이나 피드백 있으신가요?","note":"회의 마무리 질문."},{"en":"How do you feel about moving the launch date?","ko":"출시일 변경에 대해 어떻게 생각하세요?","note":"how do you feel about ~."}],"roleplay":{"situation":"설문 결과를 공유했는데 가격 관련 응답이 많았습니다. 동료 의견을 묻습니다.","question":"Ask a colleague's opinion on the survey results.","questionKo":"설문 결과에 대한 동료의 의견을 물어보세요.","model":"What are your thoughts on the survey results? I was surprised by the price feedback.","modelKo":"설문 결과에 대해 어떻게 생각하세요? 가격 관련 피드백이 많아서 놀랐어요.","tips":["내 반응을 덧붙이면 대화가 자연스럽게 이어져요.","be surprised by ~ = ~에 놀라다."]},"source":"스픽 비즈니스 (실무 영어) Day 26","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C","driveSource":"내 드라이브 '스픽 스크립트'에 같은 문장 수록"},{"n":27,"title":"정중한 회신 요청","key":"Please let me know at your earliest convenience.","keyKo":"가능한 빨리 알려주세요. (공손한 표현)","nuance":"at your earliest convenience는 '가능한 한 빠른 시일 내에'라는 격식 표현. 재촉처럼 들리지 않습니다.","usage":"이메일 끝에 회신 기한을 부드럽게 요청할 때 씁니다.","tips":["If you could let me know by Friday, I'd appreciate it. = 금요일까지 알려주시면 감사하겠습니다.","I'd appreciate it if ~ = ~해주시면 감사하겠습니다."],"variations":[{"en":"If you could let me know by Friday, I'd apprecia king the trouble to help me with the report last night. I owe you one.","modelKo":"어젯밤 보고서 도와주시느라 고생하셨어요. 신세졌습니다.","tips":["무엇을 도와줬는지 구체적으로 말하면 진심이 전해져요.","I owe you one은 사무실에서 자주 쓰는 가벼운 감사 인사."]},"source":"스픽 비즈니스 (회사생활 영어) Day 6","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C"},{"n":7,"title":"실수로 혼났을 때","key":"I got in trouble at work for missing a deadline.","keyKo":"마감을 못 맞춰서 회사에서 혼났어.","nuance":"get in trouble은 '문제가 되어 혼나다'. for ~ing로 이유를 붙입니다.","usage":"동료에게 실수를 털어놓을 때, 같은 실수를 반복하지 않겠다고 말할 때 씁니다.","tips":["get an earful = 한소리 듣다.","give someone a hard time = ~을 힘들게 하다, 혼내다."],"variations":[{"en":"My boss gave me a hard time about the delay.","ko":"지연 때문에 상사한테 좀 혼났어.","note":"give someone a hard time = 혼내다."},{"en":"I missed the deadline and had to explain everything.","ko":"마감을 못 맞춰서 다 설명해야 했어.","note":"have to explain = 해명해야 하다."},{"en":"I got an earful from the client.","ko":"고객한테 한소리 들었어.","note":"get an earful = 잔소리를 듣다."}],"roleplay":{"situation":"지난주 마감을 놓쳐 혼났던 일을 동료에게 이야기합니다.","question":"Tell a coworker about a mistake you made last week and what you learned.","questionKo":"지난주 실수와 배운 점을 동료에게 이야기해 보세요.","model":"I got in trouble at work for missing a deadline — the client wasn't happy, so I'm being extra careful now.","modelKo":"마감을 놓쳐서 회사에서 혼났어요. 고객도 좋아하지 않아서 지금은 더 꼼꼼히 챙기고 있어요.","tips":["실수 + 결과 + 달라진 점으로 말하면 성숙하게 들려요.","be extra careful = 각별히 조심하다."]},"source":"스픽 비즈니스 (회사생활 영어) Day 7","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C"},{"n":8,"title":"퇴근 후 약속 잡기","key":"Are you down for some chicken and beer after work?","keyKo":"일 끝나고 치맥 어때?","nuance":"be down for ~는 '~할래?'의 캐주얼한 표현. 직장 동료끼리 편하게 씁니다.","usage":"퇴근 후 회식이나 가벼운 약속을 제안할 때 씁니다.", n you get to the lobby and I'll come down.","modelKo":"로비에 도착하면 연락 주세요. 제가 내려가겠습니다.","tips":["and I'll ~로 내 다음 행동을 붙이면 친절하게 들려요.","come down = 내려가다."]},"source":"스픽 비즈니스 (회사생활 영어) Day 14","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C"},{"n":15,"title":"오늘 짬 내서 하기","key":"I can squeeze that in today.","keyKo":"오늘 짬 내서 할 수 있어.","nuance":"squeeze in은 빡빡한 일정에 '억지로 끼워 넣다'. 바쁘지만 해주겠다는 뉘앙스가 있습니다.","usage":"바쁜데도 짧은 요청을 들어줄 때, 혹은 못 들어줄 때 씁니다.","tips":["I'm swamped = 일이 산더미예요.","fit it in = 시간을 내다."],"variations":[{"en":"I can fit it in after lunch.","ko":"점심 후에 시간 낼 수 있어요.","note":"fit in = 끼워 넣다."},{"en":"Let me squeeze you in at 4.","ko":"4시에 잠깐 시간 내줄게요.","note":"squeeze someone in = 시간을 내주다."},{"en":"I don't think I can squeeze it in today.","ko":"오늘은 도저히 시간이 안 나요.","note":"정중한 거절."}],"roleplay":{"situation":"동료가 오늘 10분만 시간을 달라고 합니다. 바쁘지만 4시 30분은 가능합니다.","question":"A colleague asks for 10 minutes today. You're busy but can manage later.","questionKo":"바쁘지만 늦게 시간을 낼 수 있다고 답해 보세요.","model":"I'm swamped, but I can squeeze that in at 4:30 — does that work?","modelKo":"일이 많긴 한데 4시 30분에 잠깐 시간 낼 수 있어요. 괜찮으세요?","tips":["I'm swamped, but ~으로 상황을 솔직히 알리세요.","does that work?로 상대 일정을 확인하세요."]},"source":"스픽 비즈니스 (회사생활 영어) Day 15","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C"},{"n":16,"title":"복습 · 찐 미국 회사 표현","review":true,"key":"We need to touch base.","keyKo":"우리 잠깐 확인차 대화해야 돼요.","nuance":"offline → touch base → keep in the loop → ping → squeeze in. 회의 밖에서 일이 굴러가는 다섯 문장입니다.","usage":"메신저와 짧은 대화에서 쓰는 실전 표현을 정리합니다.","tips":["Day 11~15를 이어 말해 보세요.","실제 메신저에 그대로 써 보면 기억이 오래갑니다."],"variations":[{"en":"Why don't we discuss the issue offline?","ko":"그 이슈는 따로 논의하는 게 어때요?","not f things.","keyKo":"마케팅 부분은 제가 처리할게요.","nuance":"역할 나누기 → 여유 확인 → 요점 듣기 → 밀린 일. 협업에서 매일 반복되는 흐름입니다.","usage":"프로젝트 협업 대화를 한 번에 연습합니다.","tips":["Day 17~20을 이어 말해 보세요.","부탁 전에 여유를 묻는 습관이 관계를 지켜줍니다."],"variations":[{"en":"Do you have the bandwidth to prepare the meeting?","ko":"회의 준비할 여유가 되세요?","note":"Day 18 · 여유 확인."},{"en":"Could you give me a quick rundown of the meeting?","ko":"회의 요점을 간단히 알려줄 수 있어요?","note":"Day 19 · 요점."},{"en":"I have a lot of emails to catch up on.","ko":"밀린 이메일이 많아요.","note":"Day 20 · 밀린 일."},{"en":"I'll take care of it and let you know.","ko":"제가 처리하고 알려드릴게요.","note":"Day 17 · 분담."}],"roleplay":{"situation":"거래처 메일은 내가 맡고, 점심 후 회의 요점을 듣고 싶습니다.","question":"Take one task and ask for a summary later.","questionKo":"한 가지 일을 맡겠다고 하고 나중에 요점을 물어보세요.","model":"I'll take care of the client emails. Could you give me a quick rundown of the meeting after lunch?","modelKo":"거래처 메일은 제가 맡을게요. 점심 후에 회의 요점을 간단히 알려줄 수 있나요?","tips":["내가 맡는 일 + 상대에게 부탁할 일을 짝지어 말하세요.","after lunch처럼 시간을 붙이면 실행이 빨라요."]},"source":"스픽 비즈니스 (회사생활 영어) Day 21 (복습일)","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C"},{"n":22,"title":"상사에게 보고하기","key":"I ran the ideas by my boss.","keyKo":"상사에게 아이디어를 보고했어요.","nuance":"run something by someone은 '의견을 구하다, 확인받다'. 결정 전에 상사에게 미리 보여주는 행위입니다.","usage":"아이디어나 계획을 상사에게 먼저 확인받았음을 알릴 때 씁니다.","tips":["Let me run this by my manager first. = 상사에게 먼저 확인해볼게요.","get the green light = 승인을 받다."],"variations":[{"en":"Let me run this by my manager first.","ko":"상사에게 먼저 보고할게요.","note":"결정 전 확인할 때."},{"en":"I ran the numbers by the finance team.","ko":"재무팀에 숫자를 확인받았어요.","note":"run ~ by + 사람/팀."},{"en":"Can I run something by you?","ko":"하나 여쭤봐도 될까요?","note":"의견을 구할 때 쓰는 부드러운 시작."}],"roleplay":{"situation":"거래처가 제안한 아이디어를 바로 확답하지 않고 상사에게 확인하려 합니다.","question":"Tell a client you'll confirm the idea with your manager first.","questionKo":"아이디어를 상사에게 먼저 확인하겠다고 거래처에 말해 보세요.","model":"That sounds good — let me run it by my boss and I'll get back to you tomorrow.","modelKo":"좋은 것 같습니다. 상사에게 먼저 확인하고 내일 연락드릴게요.","tips":["거절이 아니라 절차라는 점을 분명히 하세요.","get back to you tomorrow로 기한을 주면 신뢰가 생깁니다."]},"source":"스픽 비즈니스 (회사생활 영어) Day 22","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C"},{"n":23,"title":"결정을 알리기","key":"We decided to move forward with the project.","keyKo":"프로젝트를 진행하기로 결정했어요.","nuance":"move forward with ~는 '~을 진행하다'. go ahead with도 같은 뜻입니다.","usage":"검토 후 결정 사항을 팀이나 거래처에 알릴 때 씁니다.","tips":["put on hold = 보류하다.","get the green light = 승인되다."],"variations":[{"en":"We're going ahead with the launch.","ko":"출시를 진행하기로 했어요.","note":"go ahead with = 진행하다."},{"en":"We've decided to put the project on hold.","ko":"프로젝트를 보류하기로 했습니다.","note":"put on hold = 보류하다."},{"en":"The plan got the green light.","ko":"계획이 승인됐어요.","note":"green light = 승인 신호."}],"roleplay":{"situation":"수치를 검토한 뒤 1분기에 프로젝트를 진행하기로 했습니다. 팀에 알리세요.","question":"Announce that the project will proceed after review.","questionKo":"검토 후 프로젝트를 진행하기로 했다고 알려 보세요.","model":"After reviewing the numbers, we decided to move forward with the project in Q1.","modelKo":"수치를 검토한 결과, 1분기에 프로젝트를 진행하기로 했습니다.","tips":["근거(After reviewing ~) + 결정 + 시점 순서로 말하세요.","in Q1처럼 시기를 붙이면 다음 행동이 정해집니다."]},"source":"스픽 비즈니스 (회사생활 영어) Day 23","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C"},{"n":24,"title":"순조롭게 진행 중","key":"We're on track.","keyKo":"순조롭게 진행되고 있어요.","nuance":"on track은 '일정대로'. 반대는 behind schedule(지연), ahead of schedule(조기).","usage":"주간 보고에서 상태를 한 단어로 전달할 때 씁니다.","tips":["on track to ~ = ~할 수 있게 순조롭다.","according to plan = 계획대로."],"variations":[{"en":"We're on track to finish by Friday.","ko":"금요일까지 끝낼 수 있게 순조롭게 진행 중이에요.","note":"on track to + 동사원형."},{"en":"Everything is going according to plan.","ko":"모든 게 계획대로 되고 있어요.","note":"according to plan = 계획대로."},{"en":"We're a little ahead of schedule.","ko":"일정보다 조금 앞서 있어요.","note":"ahead of schedule = 일정보다 빠르게."}],"roleplay":{"situation":"샘플이 화요일에 도착하고 금요일 완료가 가능합니다. 상태를 보고하세요.","question":"Give a status update: on track and finishing Friday, with a reason.","questionKo":"순조롭고 금요일에 끝난다는 상태 보고를 해 보세요.","model":"We're on track — the samples arrive Tuesday, so we'll finish by Friday.","modelKo":"순조롭습니다. 샘플이 화요일에 도착해서 금요일까지 마무리할 수 있어요.","tips":["상태 + 근거를 붙이면 보고가 믿음직해져요.","so를 넣어 인과를 드러내세요."]},"source":"스픽 비즈니스 (회사생활 영어) Day 24","sourceUrl":"https://hasummer.com/entry/%EC%98%81%EC%96%B4%ED%9A%8C%ED%99%94-%EC%96%B4%ED%94%8C-%EC%8A%A4%ED%94%BD-Speak-%EC%BB%A4%EB%A6%AC%ED%81%98%EB%9F%BC-%EC%9E%90%EC%84%B8%ED%95%9C-%EC%86%8C%EA%B0%9C"},{"n":25,"title":"일정이 늦어질 때","key":"We are running behind schedule.","keyKo":"일정보다 좀 늦어지고 있어요.","nuance":"behind schedule은 '일정 지연'. 진행 중이면 running behind로 씁니다.","usage":"지연을 인정하고 대책을 함께 말해야 신뢰를 잃지 않습니다.","tips":["catch up = 만회하다.","push the deadline = 마감을 미루다."],"variations":[{"en":"We're two days behind schedule.","ko":"이틀 늦어지고 있어요.","note":"숫자로 밝히면 명확해요."},{"en":"The shipment is delayed due to the holiday.","ko":"연휴 때문에 선적이 지연됐습니다.","note":"be delayed due to ~ = ~ 때문에 지연."},{"en":"We might need to push the deadline.","ko":"마감을 미뤄야 할 수도 있어요.","note":"might need to = ~해야 할지도."}],"roleplay":{"situation":"항구 지연으로 이틀 늦어졌습니다. 주말 작업으로 만회하겠다고 보고하세요.","question":"Report a two-day delay and your recovery plan.","questionKo":"이틀 지연과 만회 계획을 보고해 보세요.","model":"We're running two days behind schedule because of the port delay, but we'll catch up by working this weekend.","modelKo":"항구 지연 때문에 이틀 늦어지고 있지만, 주말 작업으로 만회하겠습니다.","tips":["지연 + 원인 + 대책의 3단 구조가 기본입니다.","because of + 명사 = ~ 때문에."]},"source":"스픽 비즈니스 (회사생활 영어) Day 25 <script>

(function () {

  var LS_KEY = 'speakdaily.v1';
  var DAYS = [];
  var TRACK = {};
  var CH = {};

  var S = {
    track: 'A',
    chapter: {},
    progress: {},
    days: {},
    streak: { count: 0, last: '' },
    settings: { theme: 'system', rate: 1, apiKey: '', autoPlay: true, hideKo: false }
  };

  var UI = { tab: 'home' };

  var R = null;               // review state
  var rate = 1;               // current playback rate in lesson

  /* ---------------- tiny helpers ---------------- */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function todayStr(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function shiftDay(str, delta) {
    var p = str.split('-');
    var dt = new Date(+p[0], +p[1] - 1, +p[2]);
    dt.setDate(dt.getDate() + delta);
    return todayStr(dt);
  }
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

        DAYS.push(d);
      });

  });
  function dayById(id) {
